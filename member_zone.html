<script>
// ==========================================
// 1. 全域變數與基礎設定 (保留核心)
// ==========================================
let currentUser = {};

const GAS_URL = "https://script.google.com/macros/s/AKfycbymlOJwVkQKdFMMVc9tmLgNxraaSaG3fOksPQk7hpYybGC8p6Auzk6NpJffiDDcYrlq/exec";

// =========================================
// 2. 資料同步核心：確保公告、權限、行事曆一個不漏
// ==========================================
async function syncData() {
    console.log("=== 1. syncData 開始執行 ===");
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = 'flex';

    const infoStr = sessionStorage.getItem('userInfo');
    const cachedUserInfo = infoStr ? JSON.parse(infoStr) : null;

    if (!cachedUserInfo || !cachedUserInfo.phone) {
        console.error("❌ 找不到用戶電話，導回登入頁");
        if (overlay) overlay.style.display = 'none';
        window.location.href = 'index.html';
        return;
    }

    try {
        // 請將 cached.phone 改為 cachedUserInfo.phone
        const url = `${GAS_URL}?type=member_init&phone=${cachedUserInfo.phone}&t=${Date.now()}`;
        
        const res = await fetch(url);
        const data = await res.json();

        console.log("=== 2. 收到後端資料 ===", data);

        if (data.result === "SUCCESS") {
            // --- A. Config ---
            if (data.config) globalConfig = data.config;

            // 🌟 新增：將完整的活動清單寫入 localStorage，供報名頁面使用
            if (data.events && Array.isArray(data.events)) {
               localStorage.setItem('allEvents', JSON.stringify(data.events));
               console.log("✅ 已同步活動配置到快取，包含欄位：", Object.keys(data.events[0] || {}));
            }         

            // --- B. 頂部跑馬燈公告 ---
            const newsElem = document.getElementById('news');
            const newsContainer = document.getElementById('newsContainer');
            const newsContent = data.news ? data.news.trim() : "";

            function getNumericDate(input) {
                if (!input) return null;
                const d = new Date(input);
                if (isNaN(d.getTime())) return null;
                return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
            }

            const todayVal = getNumericDate(new Date());
            const startVal = getNumericDate(data.startDate);
            const endVal = getNumericDate(data.endDate);

            const isWithinRange = (!startVal || todayVal >= startVal) && (!endVal || todayVal <= endVal);

            if (newsContent && newsContent !== "NONE" && isWithinRange) {
                if (newsContainer) {
                    newsContainer.classList.remove('hidden');
                    newsContainer.style.display = 'flex';
                }
                if (newsElem) newsElem.innerText = newsContent;
            } else {
                if (newsContainer) {
                    newsContainer.classList.add('hidden');
                    newsContainer.style.display = 'none';
                }
            }

            // --- C. 近期活動預告 (System!B5) ---
            const upcomingRaw = data.upcoming || "";
            if (upcomingRaw && upcomingRaw !== "目前暫無預定活動") {
                const dateMatch = upcomingRaw.match(/(\d{4}\/\d{2}\/\d{2})/);
                const posterMatch = upcomingRaw.match(/\[POSTER\](.*?)\[\/POSTER\]/);
                const descMatch = upcomingRaw.match(/\(簡介：(.*?)\)/);

                let upTitle = upcomingRaw.replace(/【近期預告】/, "").replace(/\d{4}\/\d{2}\/\d{2}/, "").replace(/\[POSTER\].*?\[\/POSTER\]/, "").replace(/\(簡介：.*?\)/, "").trim();

                renderCalendarActivity([{
                    dateText: dateMatch ? dateMatch[1].replace(/\//g, '-') : "",
                    title: upTitle || "近期活動",
                    poster: posterMatch ? posterMatch[1].trim() : "",
                    desc: descMatch ? descMatch[1].trim() : "歡迎踴躍參加！"
                }]);
            } else {
                renderCalendarActivity([]);
            }

            // --- D. 解析 B6 宣傳活動 ---
            const promoRaw = data.promo || data.registrations_promo || "";
            if (promoRaw && promoRaw !== "目前尚無宣傳期內之報名活動") {
                const itemStrings = promoRaw.split('[/ITEM]').filter(s => s.includes('[ITEM]'));
                window.currentActivePromos = itemStrings.map(itemStr => {
                    const pMatch = itemStr.match(/\[POSTER\](.*?)\[\/POSTER\]/);
                    const titleMatch = itemStr.match(/【近期報名活動：(.*?)】/);
                    const cleanText = itemStr.replace(/\[ITEM\]/g, "").replace(/\[POSTER\].*?\[\/POSTER\]/g, "").trim();
                    const dMatch = cleanText.match(/日期：(\d{4}\/\d{2}\/\d{2})/);
                    return {
                        title: titleMatch ? titleMatch[1].trim() : "活動",
                        fullText: cleanText,
                        poster: pMatch ? pMatch[1].trim() : "",
                        deadline: dMatch ? dMatch[1] : "額滿為止"
                    };
                });
            } else {
                window.currentActivePromos = [];
            }

            // --- E. 用戶資料合併 ---
            let displayUser = data.user && data.user.name ? data.user : cachedUserInfo;
            currentUser = displayUser;

            // --- F. 幹部模式 ---
            const staffBtn = document.getElementById('staffBtn');
            if (staffBtn) {
                const isStaff = (displayUser.role && displayUser.role !== "學員");
                staffBtn.classList.toggle('hidden', !isStaff);
                if (isStaff) staffBtn.onclick = enterStaffMode;
            }

            // --- G. 更新 UI ---
            console.log("=== 3. 執行 updateUI ===");
            // 🌟 這裡直接把 GAS 回傳的 registrations 傳下去
            updateUI(
                displayUser,
                data.totalRequired,
                data.events || [],
                data.registrations || []
            );
        }
    } catch (e) {
        console.error("❌ syncData 執行異常:", e);
    } finally {
        if (overlay) overlay.style.display = 'none';
    }
}
function updateUI(user, totalRequiredFromGAS, events, registrations) {
    console.log("=== updateUI 開始更新 ===");

    // 1. 顯示姓名
    const nameElem = document.getElementById('userName');
    if (nameElem && user?.name) nameElem.innerText = user.name;

    // 2. 參與率計算：優先使用後端算好的 attendedCount，備援方案是計算 Log 長度
    // 註：這部分數據來自後端的「會員名單」工作表
    const attendCount = (user?.attendedCount !== undefined) ? Number(user.attendedCount) : (user?.attendedLogs?.length || 0);
    const totalEvents = Number(totalRequiredFromGAS) || 0;
    const rate = totalEvents > 0 ? Math.round((attendCount / totalEvents) * 100) : 0;

    // 3. 更新介面數字 (對應截圖中的 0 / 4 與 0%)
    const countDisplay = document.getElementById('attCountDisplay');
    const percentDisplay = document.getElementById('attPercent');
    if (countDisplay) countDisplay.innerText = `${attendCount} / ${totalEvents}`;
    if (percentDisplay) percentDisplay.innerText = rate + '%';

    // 4. 達標煙火 (當大於 50% 時給予鼓勵)
    if (rate >= 50 && typeof confetti === 'function') {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#064E3B', '#059669', '#10B981'] });
    }

    // 5. 🌟 關鍵渲染：活動報名卡片
    // 使用 window.currentActivePromos (由 syncData 從 B6 宣傳字串解析而來)
    // 並傳入 registrations (由 GAS 從「報名表」過濾該會員加密電話後所得的活動清單)
    if (typeof renderRegistrationCards === 'function') {
        renderRegistrationCards(window.currentActivePromos, registrations);
    }
}   
// 點擊卡片觸發的函式

async function onScanSuccess(decodedText) {
    let rawText = decodedText.trim();
    let finalEventString = ""; 

    // 1. 解析 QR Code 內容
    if (rawText.startsWith("CHECKIN:")) {
        const parts = rawText.split(':');
        finalEventString = parts.length >= 3 ? `EVENT:${parts[1]}|${rawText.substring(rawText.indexOf(':', 8) + 1).trim()}` : rawText;
    } else {
        finalEventString = rawText;
    }

    // 2. 從 Session 取得目前使用者資訊 (包含之前登入成功存下的加密字串)
    const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || "{}");
    
    if (!userInfo.phone) {
        showToast("登入資訊失效，請重新登入", "error");
        return;
    }

    closeScanner();
    showToast("報到傳送中...", "info");

    try {
        // 3. 直接發送 Session 裡的資料，讓後端去煩惱解密/加密
        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                type: 'checkin',
                phone: userInfo.phone,           // 可能是明碼也可能是加密碼，後端會處理
                name: userInfo.name || "未知",    // 傳姓名過去以便後端紀錄
                eventTitle: finalEventString 
            })
        });

        // 🌟 關鍵修正：先檢查 response 是否正常
        if (!response.ok) {
            throw new Error("Server Response Not OK");
        }        
        const result = await response.json();
        
        if (result.result === "SUCCESS") {
            showToast("報到成功！", "success");
            if (typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
            setTimeout(() => location.reload(), 3000); // 建議直接重刷頁面最保險
        } else {
            // 🌟 這裡會抓到 "ALREADY_DONE" 或其他錯誤，並顯示後端傳來的 message
            showToast(result.message || "報到未完成", "info");
        }
    } catch (e) {
        console.error("Fetch Error:", e);
        // 如果是因為「已經報到」導致後端回傳，但解析失敗，我們可以在這裡加個保險
        showToast("通訊異常或您已報到過，請重新整理頁面確認", "error");
    }
}

// 保留原本的圖片網址處理工具
function getDirectImageUrl(url) {
    if (!url || url === "NONE" || url === "" || typeof url !== 'string') return null;
    
    // 如果是普通圖片連結，直接回傳
    if (url.startsWith('http') && !url.includes('drive.google.com')) return url;

    // 1. 嘗試從各種 Google Drive 連結格式中提取 ID
    // 支援 /file/d/ID/view, id=ID, 以及您提供的 drive_link 格式
    let fileId = "";
    const segments = url.split('/');
    const dIndex = segments.indexOf('d');
    if (dIndex !== -1 && segments[dIndex + 1]) {
        fileId = segments[dIndex + 1].split('?')[0].split('&')[0];
    } else {
        const match = url.match(/id=([^&]+)/);
        if (match) fileId = match[1];
    }

    // 2. 如果上述方法失敗，使用最後的保險：正則比對長度 25-45 的 ID 字串
    if (!fileId) {
        const fallbackMatch = url.match(/[-\w]{25,45}/);
        if (fallbackMatch) fileId = fallbackMatch[0];
    }

    if (fileId) {
        // 使用最穩定且支援度最高的縮圖 API
        // sz=w1000 確保 Demo 用的大圖也能清晰顯示
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
    }    
    return url; // 若都失敗則回傳原始網址嘗試直接載入
}

async function executeStaffVerify(autoKey) {
    const keyInput = document.getElementById('finalStaffKeyInput');
    // 如果有傳入 autoKey 就用它，否則才抓 Input 的值
    const staffKey = autoKey || (keyInput ? keyInput.value.trim() : "");
    
    if (!staffKey) {
        alert("請輸入金鑰");
        return;
    }

    const infoStr = sessionStorage.getItem('userInfo');
    const userInfoData = infoStr ? JSON.parse(infoStr) : null;
    const userPhone = userInfoData ? userInfoData.phone : ""; // 👈 改傳電話，後端比對身分更安全

    const loading = document.getElementById('loadingOverlay');
    if (loading) loading.style.display = 'flex';

    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                type: 'verify_staff_key',
                staffKey: staffKey,
                phone: userPhone // 👈 讓後端同時檢查「這支電話」是不是「幹部」
            })
        });

        const result = await response.json();

        if (result.result === "SUCCESS") {
            // 🌟 重點：驗證成功後，存入 localStorage (記在瀏覽器裡)
            localStorage.setItem('築心管理授權', staffKey);

            // 更新 SessionStorage 大箱子
            let userInfo = userInfoData || {};
            userInfo.staffKey = staffKey; 
            userInfo.userTitle = result.userTitle;
            userInfo.userPermissions = result.permissions || [];
            sessionStorage.setItem('userInfo', JSON.stringify(userInfo));
            
            // 跳轉
            window.location.href = 'staff_menu.html';
        } else {
            // 如果是自動驗證失敗（金鑰過期），就清除它並顯示 Modal
            localStorage.removeItem('築心管理授權');
            alert(result.message || "❌ 授權已失效，請重新輸入金鑰。");
            if (keyInput) {
                keyInput.value = ""; 
                keyInput.focus();
            }
        }
    } catch (e) {
        console.error("驗證出錯：", e);
        alert("系統連線異常，請稍後再試。");
    } finally {
        if (loading) loading.style.display = 'none';
    }
}

                type: 'updateProfile', // 對應 doPost 中的 case
                encryptedPhone: currentUser.encryptedPhone, 
                email: emailValue,     // 🌟 修正：對齊後端用的參數名 'email' (原為 newEmail)
                newPassword: newPassword,
                oldPassword: oldPassword 
            })
        });

        const result = await response.json();

        if (result.result === "SUCCESS") {
            // 🌟 優化：先同步本地快取，再提示重新整理
            if (currentUser) {
                currentUser.email = emailValue;
                sessionStorage.setItem('userInfo', JSON.stringify(currentUser));
            }
            
            showToast("資料修改成功！正在重新整理...", "success");
            closeProfileModal();
            
            // 延遲重整以顯示成功訊息
            setTimeout(() => {
                location.reload(); 
            }, 1500);
        } else {
            showToast(result.message || "更新失敗", "error");
        }
    } catch (e) {
        console.error("Update Error:", e);
        showToast("連線異常，請稍後再試", "error");
    }
}    
function goToAI() {
    try {
        // 1. 從 sessionStorage 抓取首頁存進去的 userInfo 字串
        const userInfoRaw = sessionStorage.getItem('userInfo');
        
        if (userInfoRaw) {
            // 2. 將字串轉回 JSON 物件
            const userInfo = JSON.parse(userInfoRaw);
            const phone = userInfo.phone; // 這裡就是您首頁存的 u (電話)
            const name = userInfo.name || "";   // 👈 新增：抓取姓名
            
            // 3. 偵錯斷點 (確認是否有從 Session 拿到資料)
       //     alert("✅ Session 偵錯：成功拿到資料 -> " + name + " / " + phone);

            // 4. 帶著電話跳轉到 AI 頁面
            // 使用 encodeURIComponent 確保特殊字元傳遞正確
            window.location.href = 'ai_chat.html?user_phone=' + encodeURIComponent(phone) + 
                                   '&user_name=' + encodeURIComponent(name);
            
        } else {
            // 如果連 Session 都沒資料，說明可能是直接開網頁沒登入
    //        alert("⚠️ 錯誤：找不到登入資訊 (Session)，將以訪客身分跳轉。");
            window.location.href = 'ai_chat.html';
        }
    } catch (e) {
    //    console.error("解析 Session 失敗:", e);
        window.location.href = 'ai_chat.html';
    }
}
let activeVoteObj = null; // 用來儲存目前的活動資訊

function checkActiveVote() {
    const userStr = sessionStorage.getItem('userInfo');
    if (!userStr) return;
    const user = JSON.parse(userStr);
    const url = `${GAS_URL}?type=get_active_vote&phone=${encodeURIComponent(user.phone)}`;

    fetch(url)
        .then(res => res.json())
        .then(res => {
            // 🌟 關鍵修正：改為檢查 res.votes
            if (res.hasVote && res.votes && res.votes.length > 0) {
                activeVoteObj = res; 
                renderVoteBanner(res); // 將整個陣列傳去渲染
            } else {
                document.getElementById('vote-notice-container').innerHTML = "";
            }
        })
        .catch(err => console.error("偵測失敗:", err));
}
function renderVoteBanner(res) {
    const container = document.getElementById('vote-notice-container');
    if (!container) return;
    container.innerHTML = ""; // 先清空，避免重複顯示

    res.votes.forEach(item => {
        const isVoted = item.voted;
        const vote = item.data;
        const btnColor = isVoted ? "bg-slate-500" : "bg-emerald-800";
        
        container.innerHTML += `
            <div class="mt-4">
                <button onclick="handleVoteClick('${vote.id}')" 
                    class="w-full ${btnColor} py-5 rounded-[2.5rem] shadow-xl text-white flex items-center justify-between px-10 active:scale-95 transition-all">
                    <div class="flex flex-col text-left">
                        <span class="text-[10px] font-bold tracking-widest opacity-70">${isVoted ? 'SUCCESS' : 'NEW'}</span>
                        <span class="text-xl font-black tracking-widest">${vote.title}</span>
                    </div>
                    <i class="fas ${isVoted ? 'fa-chart-bar' : 'fa-arrow-right'}"></i>
                </button>
            </div>`;
    });
}
/**
 * 開啟投票彈窗
 */
function openVoteOverlay() {
    console.log("嘗試開啟投票 Overlay...");
    
    // 1. 檢查是否有進行中的投票資料
    if (!window.currentVoteData || !window.currentVoteData.id) {
        alert("目前沒有進行中的投票活動。");
        return;
    }

    // 2. 顯示 Overlay 容器（假設您的彈窗 ID 是 voteOverlay）
    const overlay = document.getElementById('voteOverlay');
    if (overlay) {
        overlay.classList.remove('hidden');
        overlay.style.display = 'flex';
        
        // 3. 呼叫渲染投票內容的函式 (如果還沒寫，這裡需要實作載入問題的邏輯)
        if (typeof renderVoteContent === 'function') {
            renderVoteContent(window.currentVoteData);
        }
    } else {
        console.error("找不到 ID 為 voteOverlay 的元素");
        alert("投票系統初始化中，請稍候再試。");
    }
}

/**
 * 關閉投票彈窗
 */
function closeVoteOverlay() {
    const overlay = document.getElementById('voteOverlay');
    if (overlay) {
        overlay.classList.add('hidden');
        overlay.style.display = 'none';
    }
}  
function renderVoteContent(voteData) {
    console.log("🗳️ 準備渲染的資料:", voteData); // 🌟 新增這行來檢查
    const container = document.getElementById('voteContent');
    if (!container) return;

    // 🌟 新增解析邏輯：確保 options 是陣列且不為空
    let optionsArray = [];
    if (voteData.options) {
        // 如果後端傳來的是字串，則用逗號切割；如果是陣列則直接使用
        optionsArray = Array.isArray(voteData.options) 
            ? voteData.options 
            : voteData.options.split(',').map(opt => opt.trim());
    }

    // 如果完全沒有選項，顯示提示訊息
    if (optionsArray.length === 0) {
        container.innerHTML = `
            <div class="text-center py-20">
                <p class="text-gray-400">此投票活動尚未設定選項內容。</p>
            </div>
        `;
        return;
    }

    // 渲染選項 HTML
    const optionsHtml = optionsArray.map((opt, idx) => `
        <label class="group relative flex items-center p-5 bg-white border-2 border-gray-100 rounded-2xl cursor-pointer transition-all hover:border-emerald-500 active:scale-[0.98] mb-4 shadow-sm">
            <input type="radio" name="voteOption" value="${opt}" class="hidden peer">
            <div class="w-6 h-6 border-2 border-gray-300 rounded-full flex items-center justify-center peer-checked:border-emerald-600 peer-checked:bg-emerald-600 transition-all">
                <div class="w-2 h-2 bg-white rounded-full"></div>
            </div>
            <span class="ml-4 text-lg font-bold text-gray-700 peer-checked:text-emerald-900">${opt}</span>
        </label>
    `).join('');

    // ... 其餘渲染 Header 與 Button 的代碼不變 ...
    container.innerHTML = `
        <div class="max-w-md mx-auto">
            <div class="px-2 mb-8">
                <h1 class="text-2xl font-black text-emerald-950 mb-3">${voteData.title}</h1>
                <p class="text-gray-500 leading-relaxed">${voteData.description || ''}</p>
            </div>
            <div id="optionsContainer">${optionsHtml}</div>
            <div class="mt-10">
                <button onclick="submitUserVote()" class="w-full bg-[#F97316] py-5 rounded-[2.5rem] shadow-xl text-white text-xl font-black tracking-widest active:scale-95 transition-all">
                    送出投票
                </button>
            </div>
        </div>
    `;
}
// 🌟 別忘了新增點擊處理函式
function handleVoteClick(voteId) {
    const target = activeVoteObj.votes.find(v => v.data.id === voteId);
    if (target) {
        window.currentVoteData = target.data;
        openVoteOverlay();
    }
}    
</script>
<div id="voteOverlay" class="fixed inset-0 bg-gray-50 z-[9999] hidden flex-col">
    <nav class="bg-[#064E3B] px-6 py-5 flex items-center justify-between shrink-0 shadow-md relative">
        <button onclick="closeVoteOverlay()" class="flex items-center text-white active:scale-90 transition-all z-10">
            <i class="fas fa-chevron-left text-xl"></i>
            <span class="ml-2 font-bold tracking-widest">返回</span>
        </button>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <h2 class="text-xl font-black text-white tracking-[0.3em]">投票中心</h2>
        </div>

        <div class="w-12"></div>
    </nav>

    <div id="voteContent" class="flex-1 overflow-y-auto bg-gray-50 p-6 pb-24">
        </div>
</div>
</body>
