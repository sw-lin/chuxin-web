<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場直播收看室 - 築心讀書會</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #111827; }
    </style>
</head>
<body class="h-screen flex flex-col text-white">

    <!-- 頂部導覽列 -->
    <nav class="bg-gray-900 p-4 shadow-lg flex justify-between items-center border-b border-gray-800">
        <div class="font-bold text-base text-emerald-400 flex items-center">
            <i class="fas fa-video mr-2"></i> 築心現場直播收看室
        </div>
        <div id="connectionStatus" class="bg-amber-900/50 text-amber-400 px-3 py-1 rounded-full text-xs font-bold flex items-center">
            <span class="w-2 h-2 rounded-full bg-amber-400 mr-2 animate-pulse"></span> 尚未連線
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col p-2 sm:p-4 items-center justify-center overflow-hidden">
        
        <div class="w-full h-full max-w-7xl aspect-video bg-black rounded-xl overflow-hidden relative shadow-2xl border border-gray-700 flex items-center justify-center max-h-[85vh]">
            
            <video id="remoteVideo" class="w-full h-full object-contain" autoplay playsinline></video>
            
            <!-- 尚未連線時的遮罩提示 -->
            <div id="videoOverlay" class="absolute inset-0 bg-gray-900/90 flex flex-col items-center justify-center p-6 text-center z-10">
                <div class="w-16 h-16 bg-emerald-900/50 rounded-full flex items-center justify-center mb-4 text-emerald-400 text-2xl shadow-inner">
                    <i class="fas fa-satellite-dish"></i>
                </div>
                <h3 class="text-lg font-black mb-2 text-gray-200">準備加入直播</h3>
                <p id="hintText" class="text-xs text-gray-400 max-w-xs mb-6 leading-relaxed">點擊下方按鈕向幹部發送連線請求，審核通過後即可收看畫面。</p>
                
                <button id="requestBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95 flex items-center text-sm">
                    <i class="fas fa-hand-paper mr-2"></i> 請求加入直播
                </button>
            </div>
        </div>
    </main>

    <!-- WebRTC 與 Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue, onChildAdded, push } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXyX-rBLxWvPAJaYWabv4skVEQQWftQ0A",
            authDomain: "chuxinclub.firebaseapp.com",
            databaseURL: "https://chuxinclub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chuxinclub",
            storageBucket: "chuxinclub.firebasestorage.app",
            messagingSenderId: "135254541508",
            appId: "1:135254541508:web:6fcdfade7bf596dfc13591"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ROOM_ID = "main_room";

        const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
        const userName = userInfo.name || "熱心會員";
        const userId = userInfo.phone ? userInfo.phone.replace(/[^a-zA-Z0-9]/g, "_") : "user_" + Math.floor(Math.random() * 10000);

        const requestBtn = document.getElementById('requestBtn');
        const videoOverlay = document.getElementById('videoOverlay');
        const hintText = document.getElementById('hintText');
        const connectionStatus = document.getElementById('connectionStatus');
        const remoteVideo = document.getElementById('remoteVideo');

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let pc = null;

        requestBtn.addEventListener('click', async () => {
            requestBtn.disabled = true;
            requestBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> 正在敲門等待審核...`;
            hintText.innerText = "已向幹部送出連線請求，請稍候審核...";

            try {
                // 🌟 發送請求前，強制清空該用戶所有舊連線資料，避免狀態互相干擾
                await remove(ref(db, `rooms/${ROOM_ID}/connections/${userId}`));

                const requestRef = ref(db, `rooms/${ROOM_ID}/requests/${userId}`);
                await set(requestRef, {
                    userName: userName,
                    requestedAt: Date.now()
                });

                connectionStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-400 mr-2 animate-pulse"></span> 等待審核中`;
                listenForApproval();

            } catch (err) {
                alert("發送請求失敗：" + err.message);
                requestBtn.disabled = false;
                requestBtn.innerHTML = `<i class="fas fa-hand-paper mr-2"></i> 請求加入直播`;
            }
        });

        function listenForApproval() {
            const requestRef = ref(db, `rooms/${ROOM_ID}/requests/${userId}`);
            const offerRef = ref(db, `rooms/${ROOM_ID}/connections/${userId}/offer`);
            
            let isApproved = false;

            // 🌟 修復 1：直接監聽「是否收到 Offer」，這才是真正的幹部同意建立連線
            onValue(offerRef, (snapshot) => {
                const offer = snapshot.val();
                if (offer && !isApproved) {
                    isApproved = true;
                    videoOverlay.style.display = 'none';
                    connectionStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span> 接收視訊中`;
                    connectionStatus.classList.replace('bg-amber-900/50', 'bg-emerald-900/50');
                    connectionStatus.classList.replace('text-amber-400', 'text-emerald-400');

                    initWebRTCReceiver(offer);
                }
            });

            // 🌟 修復 2：監聽敲門單消失。若消失卻沒有收到 Offer，代表幹部按下拒絕或直播已關閉
            onValue(requestRef, (snapshot) => {
                if (!snapshot.exists() && !isApproved) {
                    setTimeout(() => {
                        if (!isApproved) {
                            alert("您的連線請求未通過，或幹部已關閉直播。");
                            location.reload();
                        }
                    }, 1500); // 緩衝時間，避免 Firebase 寫入先後順序時間差
                }
            });
        }

        async function initWebRTCReceiver(offer) {
            if (pc) pc.close(); // 清除舊連線
            pc = new RTCPeerConnection(rtcConfig);

            pc.ontrack = (event) => {
                console.log("✅ 成功收到遠端視訊串流！");
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            pc.onconnectionstatechange = () => {
                console.log("🔗 WebRTC 連線狀態改變:", pc.connectionState);
                if (pc.connectionState === 'connected') {
                    connectionStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span> 直播連線中`;
                } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    connectionStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span> 連線中斷`;
                    connectionStatus.classList.replace('bg-emerald-900/50', 'bg-red-900/50');
                    connectionStatus.classList.replace('text-emerald-400', 'text-red-400');
                    
                    // 🌟 修復 3：斷線時自動還原介面，允許會員再次點擊重連
                    videoOverlay.style.display = 'flex';
                    hintText.innerText = "連線已中斷，請確認網路狀態或重新請求。";
                    requestBtn.disabled = false;
                    requestBtn.innerHTML = `<i class="fas fa-redo mr-2"></i> 重新連線`;
                }
            };

            // 收集會員端的 ICE Candidate
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `rooms/${ROOM_ID}/connections/${userId}/candidateFromViewer`), event.candidate.toJSON());
                }
            };

            try {
                // 🌟 關鍵修復 4：必須先完整設定好幹部的遠端描述 (Offer)
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                
                // 建立 Answer 並寫入 Firebase
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await set(ref(db, `rooms/${ROOM_ID}/connections/${userId}/answer`), {
                    type: answer.type,
                    sdp: answer.sdp
                });

                // 🌟 關鍵修復 5：在此之後，才開始接收並加入幹部傳來的 ICE 數據！
                // (移除了原本放太外面的監聽器，解決 Race Condition 搶拍報錯的問題)
                onChildAdded(ref(db, `rooms/${ROOM_ID}/connections/${userId}/candidateToViewer`), async (snapshot) => {
                    const candidate = snapshot.val();
                    if (candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(candidate));
                        } catch (e) {
                            console.error("❌ 加入遠端 ICE 失敗:", e);
                        }
                    }
                });

            } catch (err) {
                console.error("❌ 建立 WebRTC 連線失敗:", err);
            }
        }
    </script>
</body>
</html>
