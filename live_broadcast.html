<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場直播控制台 - 築心讀書會</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #111827; }
    </style>
</head>
<body class="h-screen flex flex-col text-white">

    <!-- 頂部導覽列 -->
    <nav class="bg-gray-900 p-4 shadow-lg flex justify-between items-center border-b border-gray-800">
        <div class="font-bold text-lg text-emerald-400">
            <i class="fas fa-video mr-2"></i> 現場直播控制台
        </div>
        <div id="statusBadge" class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full text-sm font-bold flex items-center">
            <span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span> 準備中
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- 左側：影像預覽區 -->
        <div class="flex-1 bg-black rounded-xl overflow-hidden relative shadow-2xl border border-gray-700">
            <!-- muted 很重要，避免自己聽到自己的回音 -->
            <video id="localVideo" class="w-full h-full object-cover" autoplay muted playsinline></video>
            
            <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-4">
                <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105">
                    <i class="fas fa-play mr-2"></i> 開始直播
                </button>
                <button id="stopBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105 hidden">
                    <i class="fas fa-stop mr-2"></i> 結束直播
                </button>
            </div>
        </div>

        <!-- 右側：連線審核區 -->
        <div class="w-full md:w-80 bg-gray-800 rounded-xl flex flex-col border border-gray-700 shadow-xl overflow-hidden">
            <div class="bg-gray-900 p-3 border-b border-gray-700 font-bold text-emerald-300 flex justify-between items-center">
                <span>會員連線請求</span>
                <span id="requestCount" class="bg-emerald-900 text-emerald-300 text-xs px-2 py-1 rounded-full">0</span>
            </div>
            
            <!-- 請求列表 -->
            <div id="requestsContainer" class="flex-1 overflow-y-auto p-2 space-y-2">
                <div class="text-gray-500 text-sm text-center py-4">等待會員要求加入...</div>
            </div>
        </div>
    </main>

    <!-- Firebase 與 WebRTC 邏輯 -->
    <script type="module">
        // 1. 匯入 Firebase v12 模組 (包含 App 與 Database)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, onChildAdded, onChildRemoved, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        // 2. 初始化 Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBXyX-rBLxWvPAJaYWabv4skVEQQWftQ0A",
            authDomain: "chuxinclub.firebaseapp.com",
            projectId: "chuxinclub",
            storageBucket: "chuxinclub.firebasestorage.app",
            messagingSenderId: "135254541508",
            appId: "1:135254541508:web:6fcdfade7bf596dfc13591"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 3. 取得 UI 元素
        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusBadge = document.getElementById('statusBadge');
        const requestsContainer = document.getElementById('requestsContainer');
        const requestCount = document.getElementById('requestCount');

        let localStream = null;
        const ROOM_ID = "main_room"; // 預設讀書會房間 ID

        // 4. 取得本機攝影機與麥克風權限
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
            } catch (error) {
                console.error("無法取得攝影機權限:", error);
                alert("請允許網頁存取攝影機與麥克風，否則無法進行直播！");
            }
        }

        // 5. 開始直播：寫入 Firebase 狀態
        async function startBroadcast() {
            if (!localStream) await initCamera();

            const statusRef = ref(db, `rooms/${ROOM_ID}/status`);
            
            // 寫入開播狀態
            await set(statusRef, { 
                isLive: true, 
                startedAt: Date.now() 
            });

            // 【斷線防呆】如果幹部直接關閉網頁或斷網，Firebase 會自動把 isLive 設為 false
            onDisconnect(statusRef).set({ isLive: false });

            // 更新 UI
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2 animate-pulse"></span> 直播中`;
            statusBadge.classList.replace('bg-gray-700', 'bg-red-900/50');
            statusBadge.classList.replace('text-gray-300', 'text-red-400');

            listenForRequests();
        }

        // 6. 結束直播：清除 Firebase 狀態
        async function stopBroadcast() {
            const statusRef = ref(db, `rooms/${ROOM_ID}/status`);
            await set(statusRef, { isLive: false });

            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span> 準備中`;
            statusBadge.classList.replace('bg-red-900/50', 'bg-gray-700');
            statusBadge.classList.replace('text-red-400', 'text-gray-300');
            
            requestsContainer.innerHTML = '<div class="text-gray-500 text-sm text-center py-4">等待會員要求加入...</div>';
            requestCount.textContent = "0";
        }

        // 7. 監聽會員「敲門」請求
        function listenForRequests() {
            const requestsRef = ref(db, `rooms/${ROOM_ID}/requests`);
            
            // 清空預設文字
            requestsContainer.innerHTML = '';

            onChildAdded(requestsRef, (snapshot) => {
                const request = snapshot.val();
                const userId = snapshot.key;

                // 建立請求卡片 UI
                const card = document.createElement('div');
                card.id = `req-${userId}`;
                card.className = "bg-gray-700 p-3 rounded-lg flex justify-between items-center animate-fade-in";
                card.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center mr-3 font-bold">
                            ${request.userName.charAt(0)}
                        </div>
                        <span class="font-bold text-sm text-gray-200">${request.userName}</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="acceptRequest('${userId}')" class="bg-emerald-600 hover:bg-emerald-500 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                            <i class="fas fa-check text-xs"></i>
                        </button>
                        <button onclick="rejectRequest('${userId}')" class="bg-red-600 hover:bg-red-500 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>
                `;
                requestsContainer.appendChild(card);
                updateRequestCount(1);
            });

            onChildRemoved(requestsRef, (snapshot) => {
                const userId = snapshot.key;
                const card = document.getElementById(`req-${userId}`);
                if (card) {
                    card.remove();
                    updateRequestCount(-1);
                }
            });
        }

        // 綁定按鈕事件
        startBtn.addEventListener('click', startBroadcast);
        stopBtn.addEventListener('click', stopBroadcast);

        // 將方法掛載到 window，讓 HTML 的 onclick 可以呼叫
        window.acceptRequest = async (userId) => {
            console.log("接受連線:", userId);
            // 這裡未來會加入 WebRTC 建立 Offer 的程式碼
            alert('已同意連線！(WebRTC 通道建立邏輯將接續於此)');
            // 移除請求 UI
            await remove(ref(db, `rooms/${ROOM_ID}/requests/${userId}`));
        };

        window.rejectRequest = async (userId) => {
            console.log("拒絕連線:", userId);
            await remove(ref(db, `rooms/${ROOM_ID}/requests/${userId}`));
        };

        function updateRequestCount(change) {
            let current = parseInt(requestCount.textContent);
            requestCount.textContent = current + change;
            if (requestsContainer.children.length === 0) {
                requestsContainer.innerHTML = '<div class="text-gray-500 text-sm text-center py-4">等待會員要求加入...</div>';
            }
        }

        // 網頁載入時先嘗試取得相機
        initCamera();
    </script>
</body>
</html>
