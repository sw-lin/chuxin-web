<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>築心健腦小願</title>    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; }
    </style>
</head>
<body class="min-h-screen pb-20">

<nav class="sticky top-0 z-40 bg-[#9d174d] text-white px-4 h-16 shadow-lg flex items-center justify-between relative">
    <button onclick="location.href='member_zone.html'" class="flex items-center gap-1 active:scale-95 outline-none z-10 text-pink-200 hover:text-white transition-colors">
        <i class="fas fa-chevron-left text-lg"></i>
        <span class="font-bold text-sm tracking-widest mt-0.5">返回</span>
    </button>
    
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <h1 class="text-lg font-black tracking-widest text-white">築心小願</h1>
    </div>

    <div class="flex gap-4 z-10">
        <button id="tab1" onclick="switchTab(1)" class="font-bold text-sm text-pink-200 border-b-2 border-white pb-1 transition-all">本週目標</button>
        <button id="tab2" onclick="switchTab(2)" class="font-bold text-sm text-pink-400 border-b-2 border-transparent pb-1 transition-all">總列表</button>
    </div>
</nav>

<div id="loadingOverlay" class="fixed inset-0 z-[300] bg-black/60 backdrop-blur-sm flex items-center justify-center">
    <div class="flex flex-col items-center"><i class="fas fa-circle-notch fa-spin text-white text-4xl mb-4"></i></div>
</div>

<div id="optInModal" class="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center hidden p-6">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm text-center shadow-2xl">
        <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-600 text-2xl"><i class="fas fa-seedling"></i></div>
        <h2 class="text-xl font-black text-gray-800 mb-2">歡迎加入築心小願</h2>
        <p class="text-sm text-gray-500 mb-6 text-left leading-relaxed">藉由每週一點點小目標，讓自己更健康、生活更有活力！</p>
        <button onclick="joinWish()" class="w-full bg-[#9d174d] text-white py-4 rounded-full font-bold shadow-lg active:scale-95 transition-all">確認參加</button>
        <button onclick="location.href='member_zone.html'" class="w-full mt-3 py-3 text-gray-400 font-bold text-sm">暫不參加</button>
    </div>
</div>

<main class="max-w-xl mx-auto p-6 space-y-6">

    <div id="page1" class="space-y-6 block">
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-pink-50 relative z-20">
            <h3 class="font-black text-pink-900 mb-4 flex items-center gap-2"><i class="fas fa-pen-nib text-pink-500"></i> 設定本週目標 (週一歸零)</h3>
            <select id="catSelect" class="w-full mb-4 p-4 bg-gray-50 rounded-xl outline-none border focus:border-pink-500 font-bold text-gray-700">
                <option value="運動">🏀 運動 (如：肌力運動)</option>
                <option value="飲食">🥗 飲食 (如：地中海好油)</option>
                <option value="學習">📖 學習 (如：禪繞畫/新語言)</option>
                <option value="社交">☕ 社交</option>
            </select>
            <textarea id="goalDesc" rows="2" placeholder="請輸入小願內容 (例：本週有畫禪繞畫3次)" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-pink-500 text-sm mb-4"></textarea>
            
            <button onclick="saveGoal()" id="saveGoalBtn" class="w-full bg-[#9d174d] text-white py-3 rounded-xl font-bold active:scale-95 transition-all shadow-md">儲存目標設定</button>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-pink-50 relative z-10">
            <h3 class="font-black text-pink-900 mb-4 flex items-center gap-2"><i class="fas fa-star-half-alt text-pink-500"></i> 每日自評進度</h3>
            
            <div id="daysContainer" class="flex justify-between items-center px-1"></div>
            <!-- 補登提示語 -->
            <p class="text-[11px] text-gray-400 text-center mt-3 mb-6 font-bold"><i class="fas fa-hand-pointer"></i> 點擊上方日期，可隨時補填或修改本週成績</p>

            <div class="flex items-center justify-between mb-2">
                <span class="text-xs text-gray-400 font-bold">未達成</span>
                <span id="scoreDisplay" class="text-4xl font-black text-[#9d174d]">0</span>
                <span class="text-xs text-gray-400 font-bold">完全達成</span>
            </div>
            <input type="range" id="scoreSlider" min="0" max="10" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mb-6 accent-[#9d174d]">
            <button onclick="saveScore()" class="w-full bg-pink-50 text-[#9d174d] border border-pink-100 py-3 rounded-xl font-bold active:scale-95 transition-all">儲存 <span id="btnDayHint">今日</span> 評分</button>
            
            <div id="scoreLock" class="absolute inset-0 bg-white/80 backdrop-blur-[2px] z-10 flex flex-col items-center justify-center rounded-[2rem] hidden">
                <i class="fas fa-lock text-[#9d174d] text-3xl mb-3 animate-bounce"></i>
                <p class="text-sm font-black text-gray-700">尚未確認本週目標</p>
                <p class="text-xs font-bold text-gray-500 mt-1 text-center px-4 leading-relaxed">系統已自動帶入您上次的設定<br>請點擊上方 <span class="text-[#9d174d]">「儲存目標設定」</span> 來解鎖評分</p>
            </div>
        </div>
    </div>

    <div id="page2" class="space-y-4 hidden">
        <div class="bg-pink-50 p-4 rounded-2xl flex gap-2 text-[11px] text-[#9d174d] font-bold leading-relaxed shadow-inner">
            <i class="fas fa-info-circle mt-0.5"></i> 系統採用動態積分制：若於週間加入，過去天數將自動豁免，絕不影響您的達成率，滿分依舊可獲一顆星！(若補登過去成績，系統將自動加回分母)
        </div>
        <div id="leaderboardContainer" class="space-y-4"></div>
    </div>

</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxplbneiq3qt_4OeahaOkzhHh8meU0qYg9D5cXV8xDxYf1CT3m7y2SaDc7JZSgs6B8/exec";
let userInfo = {};

let currentScores = Array(7).fill(null);
let selectedDayIndex = (new Date().getDay() + 6) % 7; 
let hasCurrentGoal = false;

const dayNames = ['一', '二', '三', '四', '五', '六', '日'];

window.onload = () => {
    const infoStr = sessionStorage.getItem('userInfo');
    if (!infoStr) { location.href = 'index.html'; return; }
    userInfo = JSON.parse(infoStr);
    
    document.getElementById('scoreSlider').addEventListener('input', (e) => {
        document.getElementById('scoreDisplay').innerText = e.target.value;
    });

    loadData();
};

function switchTab(tabNum) {
    document.getElementById('page1').style.display = tabNum === 1 ? 'block' : 'none';
    document.getElementById('page2').style.display = tabNum === 2 ? 'block' : 'none';
    
    document.getElementById('tab1').className = tabNum === 1 
        ? 'font-bold text-sm text-pink-200 border-b-2 border-white pb-1 transition-all' 
        : 'font-bold text-sm text-pink-400 border-b-2 border-transparent pb-1 transition-all';
    
    document.getElementById('tab2').className = tabNum === 2 
        ? 'font-bold text-sm text-pink-200 border-b-2 border-white pb-1 transition-all' 
        : 'font-bold text-sm text-pink-400 border-b-2 border-transparent pb-1 transition-all';
}

function renderDays() {
    const container = document.getElementById('daysContainer');
    const todayIndex = (new Date().getDay() + 6) % 7; // 取得今天索引 (0=一, 6=日)
    
    // 🌟 修正：移除遇到 -1 強迫跳回今天的限制，僅防堵點擊「未來天數」
    if (selectedDayIndex > todayIndex) {
        selectedDayIndex = todayIndex;
    }

    container.innerHTML = dayNames.map((d, i) => {
        const score = currentScores[i];
        const isSkip = score === -1; 
        const isFuture = i > todayIndex; 
        const isSelected = i === selectedDayIndex && !isFuture;
        const hasScore = score !== null && score !== -1;
        
        let classes = "w-10 h-11 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all outline-none ";
        
        // 處理未來天數：渲染為純文字容器，去除點擊事件
        if (isFuture) {
            classes += "bg-gray-50 text-gray-200 cursor-not-allowed";
            return `<div class="${classes}">
                <span>${d}</span>
                <span class="text-[10px] mt-0.5 opacity-50">-</span>
            </div>`;
        }

        // 處理可點擊的天數 (過去與今天)
        if (isSelected) classes += "ring-2 ring-[#9d174d] ring-offset-2 scale-110 shadow-sm z-10 bg-white ";

        if (hasScore) {
            classes += "bg-pink-100 text-[#9d174d] ";
        } else if (isSkip) {
            classes += "bg-gray-50 text-gray-400 border border-dashed border-gray-300 ";
        } else {
            classes += "bg-gray-100 text-gray-400 ";
        }
        
        return `<button onclick="selectDay(${i})" class="${classes} cursor-pointer hover:bg-gray-200">
            <span>${d}</span>
            <span class="text-[10px] mt-0.5 opacity-80">${hasScore ? score : (isSkip ? '免' : '-')}</span>
        </button>`;
    }).join('');

    // 更新 Slider 與按鈕文字
    const val = (currentScores[selectedDayIndex] !== null && currentScores[selectedDayIndex] !== -1) ? currentScores[selectedDayIndex] : 0;
    document.getElementById('scoreSlider').value = val;
    document.getElementById('scoreDisplay').innerText = val;
    document.getElementById('btnDayHint').innerText = `週${dayNames[selectedDayIndex]}`;
}

function selectDay(index) {
    selectedDayIndex = index;
    renderDays();
}

async function loadData() {
    try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'wish_init', phone: userInfo.encryptedPhone || userInfo.phone }) }).then(r=>r.json());
        document.getElementById('loadingOverlay').style.display = 'none';
        
        if (!res.data.is_joined) {
            document.getElementById('optInModal').style.display = 'flex';
        } else {
            if (res.data.currentRecord) {
                hasCurrentGoal = true;
                document.getElementById('catSelect').value = res.data.currentRecord.category;
                document.getElementById('goalDesc').value = res.data.currentRecord.goal_desc;
                currentScores = res.data.currentRecord.scores;
                document.getElementById('saveGoalBtn').classList.remove('animate-pulse');
            } else if (res.data.lastGoal) {
                document.getElementById('catSelect').value = res.data.lastGoal.category;
                document.getElementById('goalDesc').value = res.data.lastGoal.goal_desc;
                document.getElementById('saveGoalBtn').classList.add('animate-pulse');
            }

            document.getElementById('scoreLock').style.display = hasCurrentGoal ? 'none' : 'flex';
            renderDays();
            renderLeaderboard(res.data.leaderboard);
        }
    } catch(e) { alert("連線異常，請重新整理"); }
}

async function joinWish() {
    document.getElementById('optInModal').style.display = 'none';
    document.getElementById('loadingOverlay').style.display = 'flex';
    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'wish_opt_in', phone: userInfo.encryptedPhone || userInfo.phone, name: userInfo.name }) });
    location.reload();
}

async function saveGoal() {
    const cat = document.getElementById('catSelect').value;
    const desc = document.getElementById('goalDesc').value.trim();
    if(!desc) { alert("請輸入目標內容"); return; }
    
    document.getElementById('loadingOverlay').style.display = 'flex';
    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'wish_save_goal', phone: userInfo.encryptedPhone || userInfo.phone, category: cat, goal_desc: desc }) });
    location.reload(); 
}

async function saveScore() {
    if (!hasCurrentGoal) return; 
    const score = document.getElementById('scoreSlider').value;
    document.getElementById('loadingOverlay').style.display = 'flex';
    
    const res = await fetch(GAS_URL, { 
        method: 'POST', 
        body: JSON.stringify({ 
            type: 'wish_save_score', 
            phone: userInfo.encryptedPhone || userInfo.phone, 
            dayIndex: selectedDayIndex,
            score: score 
        }) 
    }).then(r=>r.json());
    
    if (res.result === "ERROR") { 
        alert(res.message); 
    } else {
        currentScores[selectedDayIndex] = Number(score);
        renderDays();
        document.getElementById('loadingOverlay').style.display = 'none';
    }
}

function renderLeaderboard(data) {
    const container = document.getElementById('leaderboardContainer');
    container.innerHTML = data.map(user => {
        const maxScore = user.total_max_score || 0; 
        const percent = maxScore > 0 ? Math.round((user.total_score / maxScore) * 100) : 0;
        const starsHtml = Array(user.stars).fill('<i class="fas fa-star text-yellow-400 text-[10px]"></i>').join('');
        
        return `
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="font-black text-gray-800 text-base">${user.name}</span>
                    <span class="flex gap-0.5">${starsHtml}</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs px-2.5 py-0.5 bg-pink-50 text-[#9d174d] rounded-full font-bold border border-pink-100">${user.category}</span>
                    <span class="text-sm font-black text-[#9d174d]">${percent}%</span>
                </div>
            </div>
            
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs text-gray-600 font-medium leading-relaxed flex items-start gap-2">
                <i class="fas fa-bullseye text-pink-400 mt-0.5 shrink-0"></i>
                <span class="break-all">${user.goal_desc}</span>
            </div>

            <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden shadow-inner">
                <div class="bg-[#9d174d] h-full rounded-full transition-all duration-1000" style="width: ${percent}%"></div>
            </div>
        </div>`;
    }).join('');
}
</script>
</body>
</html>
