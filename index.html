<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxplbneiq3qt_4OeahaOkzhHh8meU0qYg9D5cXV8xDxYf1CT3m7y2SaDc7JZSgs6B8/exec";
let slideIndex = 0;
let globalConfig = {}; // 🌟 新增：用來儲存從 GAS 抓到的全域設定開關   

// 強化後的網址轉換邏輯
function transformDriveUrl(url) {
    if (!url) return "";
    if (!url.includes('drive.google.com')) return url;
    let id = "";
    if (url.includes('id=')) { id = url.split('id=')[1].split('&')[0]; }
    else if (url.includes('/d/')) { id = url.split('/d/')[1].split('/')[0]; }
    return id ? `https://lh3.googleusercontent.com/d/${id}` : url;
}

function toHalfWidth(str) {
    if (!str) return "";
    return str.replace(/[０-９Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\s/g, "");
}

async function initData() {
    const contentDiv = document.getElementById('aboutContent');
    const container = document.getElementById('slideContainer');

    try {
        const res = await fetch(GAS_URL + "?t=" + Date.now());
        const data = await res.json();
        const config = data.config || {};
        globalConfig = config; // 🌟 新增：將設定存入全域變數，供後續登入判斷
        console.log("接收到的 Config:", config);      

        // --- 1. 處理「關於築心」文字 ---
        // --- 🌟 修正後的「關於築心」文字處理 ---
        // 由於資料可能是物件 {promo: '...', normal: '...'} 或純字串
        const rawAbout = config.about_us_text || config.about_content || "";
        let aboutText = "";

        if (typeof rawAbout === 'object') {
            // 如果是物件，根據邏輯選取內容（這裡優先取 normal，因為介紹通常不分活動期）
            // 或者您可以根據 isPromoTime 來決定取哪一個
            aboutText = rawAbout.normal || rawAbout.promo || "";
        } else {
            aboutText = rawAbout;
        }
        
       if (aboutText) {
    // 🌟 強化版替換：同時處理 \n 與 \r，並將連續換行正確轉為 <br>
    const formattedText = aboutText
        .replace(/\r\n/g, '<br>') // 處理 Windows 換行
        .replace(/\n/g, '<br>')   // 處理 Linux/Mac 換行
        .replace(/\r/g, '<br>');  // 處理舊式 Mac 換行
    
    contentDiv.innerHTML = formattedText; 
    } else {
    contentDiv.innerHTML = "歡迎來到築心讀書會。";
    }
        // --- 2. 判斷是否為宣傳期 ---
        const now = new Date();
        let isPromoTime = false;
        
        // 取得日期 (相容物件格式與純字串格式)
        const getVal = (obj) => (obj && typeof obj === 'object') ? obj.promo : (obj || "");
        const startDateStr = getVal(config.promo_start);
        const endDateStr = getVal(config.promo_end);

        if (startDateStr && endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            end.setHours(23, 59, 59, 999);
            if (now >= start && now <= end) isPromoTime = true;
        }
        console.log("目前是否為宣傳期:", isPromoTime);

        // --- 3. 處理輪播圖邏輯 (宣傳優先) ---
        let slidesUrls = [];

        if (isPromoTime) {
            // 嘗試抓取 B 欄宣傳圖
            for (let i = 1; i <= 5; i++) {
                const imgUrl = config[`slide_img${i}`]?.promo;
                if (imgUrl && imgUrl.trim() !== "" && !imgUrl.includes("images/")) {
                    slidesUrls.push(transformDriveUrl(imgUrl));
                }
            }
        }

        // 如果不是宣傳期，或者宣傳期 B 欄完全沒圖，才抓常態圖
        if (slidesUrls.length === 0) {
            for (let i = 1; i <= 5; i++) {
                const item = config[`slide_img${i}`];
                const imgUrl = (typeof item === 'object') ? item.normal : item;
                if (imgUrl && imgUrl.trim() !== "" && !imgUrl.includes("images/")) {
                    slidesUrls.push(transformDriveUrl(imgUrl));
                }
            }
        }

        // --- 4. 渲染圖片 ---
        if (slidesUrls.length > 0) {
            container.innerHTML = slidesUrls.map((url, idx) => 
                `<img class="slide" src="${url}" onerror="this.src='${idx + 1}.jpg'">`
            ).join('');
        } else {
            container.innerHTML = `<img class="slide" src="1.jpg" style="display:block">`;
        }        
        
        startSlides();

    } catch (e) {
        console.error("initData 失敗:", e);
        contentDiv.innerHTML = "連線失敗，請檢查網路。";
    }
}

function startSlides() {
    let slides = document.getElementsByClassName("slide");
    if (slides.length === 0) return;
    for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
    slideIndex++;
    if (slideIndex > slides.length) slideIndex = 1;
    slides[slideIndex - 1].style.display = "block";
    setTimeout(startSlides, 5000);
}

async function handleLogin() {
    // 1. 先取得原始輸入，轉小寫並去空白
    const rawInput = document.getElementById('userPhone').value.trim();
    const cleanInput = rawInput.toLowerCase(); // 用於判斷 guest
    const p = toHalfWidth(document.getElementById('userPass').value.trim());
    
    // 🌟 優先判斷：如果是訪客，直接跳轉
    if (cleanInput === 'guest') {
        sessionStorage.setItem('userInfo', JSON.stringify({ 
            result: "SUCCESS", name: "訪客", phone: "guest", role: "Guest", isPaid: false 
        }));
        window.location.href = 'guest_zone.html'; 
        return;
    }    

    // 2. 如果不是 guest，才進行手機號碼清洗 (只留數字)
    // 這裡我們直接對 rawInput 做清洗
    const u = toHalfWidth(rawInput).replace(/[^0-9]/g, "");

    // 3. 檢查是否輸入完整
    if(!u || !p) {
        return alert("請輸入帳號密碼");
    }
    
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; 
    btn.innerText = "驗證中...";
    
    try {
        const res = await fetch(GAS_URL, { 
            method: 'POST',
            body: JSON.stringify({ type: 'login', phone: u, password: p }) 
        });
        
        const result = await res.json();
        
        if (result.result === "SUCCESS") {
            // 1. 處理繳費狀態 (🌟 增加防呆：同時支援後端傳回布林值 true 或中文字串 "已繳")
            const isPaidStatus = String(result.isPaid).toLowerCase() === "true" || String(result.isPaid).trim() === "已繳";

            console.log("GAS 回傳原始資料:", result);
            
           // 2. 讀取試算表設定開關 (enforce_paid_member)
            // 🌟 防呆補抓：如果使用者手速太快，網頁剛開還沒載入完 Config 就按登入，我們就在這裡緊急補抓一次
            let currentConfig = globalConfig;
            if (!currentConfig || Object.keys(currentConfig).length === 0) {
                console.warn("Config 尚未載入，嘗試補抓...");
                try {
                    const configRes = await fetch(GAS_URL + "?t=" + Date.now());
                    const configData = await configRes.json();
                    currentConfig = configData.config || {};
                    globalConfig = currentConfig; // 順便更新回全域變數
                } catch(e) {
                    console.error("補抓 Config 失敗", e);
                }
            }

            // 只要設定為「是」或「開」，就會啟動嚴格審查；若填「否」、「關」或未填，則代表學期初放行期
            const enforceSetting = String(currentConfig.enforce_paid_member || "").trim();
            const isEnforceOn = (enforceSetting === "是" || enforceSetting === "開" || enforceSetting === "true");
            // 3. 根據「身份」、「繳費狀態」與「後台開關」決定是否核發會員專區通行證 (hasMemberAccess)
            let hasMemberAccess = false;
            
            if (result.role === "Admin") {
                hasMemberAccess = true; // 管理員永遠放行
            } else if (isEnforceOn) {
                hasMemberAccess = (isPaidStatus === true); // 開啟嚴格審查時，只有真正已繳費者可拿通行證
            } else {
                hasMemberAccess = true; // 關閉審查時（每學期初混亂期），名冊內所有會員皆核發通行證
            }

            // 4. 將完整資料與通行證標籤存入 sessionStorage
            const userStore = {
                result: "SUCCESS",
                name: result.name,
                role: result.role,
                title: result.title,
                phone: u,
                email: result.email || "", 
                encryptedPhone: result.encryptedPhone || "",
                staffKey: result.staffKey || "",
                isPaid: isPaidStatus,
                hasMemberAccess: hasMemberAccess, // 🌟 新增：核發通行證標記
                attendedLogs: result.attendedLogs || []
            };
            
            sessionStorage.setItem('userInfo', JSON.stringify(userStore));

            // 5. 依據通行證決定登入當下跳轉的頁面
            let targetPage = (hasMemberAccess === true) ? 'member_zone.html' : 'guest_zone.html';
            
            console.log(`[登入分流] 繳費審查開關：${isEnforceOn ? '開啟' : '關閉'} | 會員繳費狀態：${isPaidStatus} | 核發通行證：${hasMemberAccess} -> 導向：${targetPage}`);
            window.location.href = targetPage;
        } else {
            alert("登入失敗：" + (result.message || "帳號或密碼錯誤"));
            btn.disabled = false;
            btn.innerText = "確認進入";
        }
    } catch (e) { 
        console.error("發生錯誤:", e);
        alert("連線異常"); 
        btn.disabled = false;
        btn.innerText = "確認進入";
    }
}
function openLogin() { 
    document.getElementById('loginModal').style.display = 'flex'; 
}    
function closeModal() { document.getElementById('loginModal').style.display = 'none'; }

// === PWA 強制自訂安裝機制 ===
let deferredPrompt;

// 1. 註冊 Service Worker (PWA 的硬性硬體規範)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker 註冊成功', reg))
            .catch(err => console.log('Service Worker 註冊失敗', err));
    });
}

// 2. 監聽瀏覽器是否準備好安裝
window.addEventListener('beforeinstallprompt', (e) => {
    // 阻止瀏覽器預設的低調提示
    e.preventDefault();
    // 儲存事件，留給我們自訂的按鈕觸發
    deferredPrompt = e;
    
    // 動態在「會員進入」按鈕左邊，塞入一個「安裝 App」按鈕
    const navRight = document.querySelector('nav .bg-emerald-800').parentElement;
    if (!document.getElementById('pwaInstallBtn')) {
        const installBtn = document.createElement('button');
        installBtn.id = 'pwaInstallBtn';
        installBtn.className = 'mr-2 bg-amber-500 text-emerald-950 px-4 py-2 rounded-full text-sm font-bold shadow-md hover:bg-amber-400 transition active:scale-95';
        installBtn.innerHTML = '<i class="fas fa-download mr-1"></i>安裝 App';
        
        // 點擊此按鈕，即可「強制啟動」系統安裝提示
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // 喚醒安裝視窗
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`使用者選擇結果: ${outcome}`);
                if (outcome === 'accepted') {
                    installBtn.remove(); // 使用者同意安裝後，移除按鈕
                }
                deferredPrompt = null;
            }
        });
        
        // 把按鈕塞進導覽列
        const loginBtn = document.querySelector('nav button');
        navRight.insertBefore(installBtn, loginBtn);
    }
});

// 3. 安裝完成後的監聽（選用）
window.addEventListener('appinstalled', (evt) => {
    console.log('築心讀書會 App 已成功安裝到使用者的裝置上！');
    const btn = document.getElementById('pwaInstallBtn');
    if (btn) btn.remove();
});
   
window.onload = initData; 
// 🌟 全螢幕播放器相關變數
let galleryPhotos = [];
let galleryIndex = 0;
let galleryTimer = null;

// 1. 開啟全螢幕播放
async function openFullscreenGallery() {
    const modal = document.getElementById('galleryModal');
    const imgElem = document.getElementById('fullscreenImg');
    const caption = document.getElementById('fullscreenCaption');
    
    modal.classList.remove('hidden');
    modal.style.display = 'flex';
    caption.innerText = "相簿照片載入中...";

    try {
        // 向 GAS 撈取 Config 裡 marquee_folder_id 目錄內的所有照片
        if (galleryPhotos.length === 0) {
            const res = await fetch(`${GAS_URL}?type=get_marquee_photos&t=${Date.now()}`);
            const data = await res.json();
            if (data.result === "SUCCESS" && data.photos && data.photos.length > 0) {
                galleryPhotos = data.photos;
            }
        }

        if (galleryPhotos.length > 0) {
            galleryIndex = 0;
            showNextGalleryPhoto();
            // 自動播放：每 3.5 秒自動換下一張
            if (galleryTimer) clearInterval(galleryTimer);
            galleryTimer = setInterval(showNextGalleryPhoto, 3500);
        } else {
            caption.innerText = "目前相簿中尚無照片可顯示";
        }
    } catch (e) {
        console.error("載入相簿失敗:", e);
        caption.innerText = "載入相簿發生異常";
    }
}

// 2. 顯示下一張照片
function showNextGalleryPhoto() {
    if (galleryPhotos.length === 0) return;
    const imgElem = document.getElementById('fullscreenImg');
    const caption = document.getElementById('fullscreenCaption');
    
    imgElem.style.opacity = '0.3';
    setTimeout(() => {
        imgElem.src = galleryPhotos[galleryIndex];
        caption.innerText = `活動花絮 (${galleryIndex + 1} / ${galleryPhotos.length})`;
        imgElem.style.opacity = '1';
        galleryIndex = (galleryIndex + 1) % galleryPhotos.length;
    }, 150);
}

// 3. 關閉全螢幕播放 (點擊畫面/照片即觸發)
function closeFullscreenGallery() {
    const modal = document.getElementById('galleryModal');
    modal.classList.add('hidden');
    modal.style.display = 'none';
    if (galleryTimer) {
        clearInterval(galleryTimer);
        galleryTimer = null;
    }
}
    
</script>
