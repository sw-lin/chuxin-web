<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端資料管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; }
        .emerald-gradient { background: linear-gradient(135deg, #064E3B 0%, #065F46 100%); }
        #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    </style>
    <link rel="icon" type="image/png" href="favicon-32x32.png?v=2" sizes="32x32" />
    <link rel="shortcut icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="築心讀書會" />
    <link rel="manifest" href="site.webmanifest?v=2" />
</head>
<body class="pb-32">

    <nav class="emerald-gradient text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto grid grid-cols-3 items-center">
            <div class="flex justify-start">
               <button onclick="location.href='staff_menu.html'" class="text-sm font-bold flex items-center transition hover:text-emerald-200"><i class="fas fa-chevron-left mr-1"></i>返回</button>
            </div>
            <div class="text-center whitespace-nowrap">
                <h1 class="font-black tracking-[0.2em] text-lg">雲端資料管理</h1>
            </div>
            <div class="flex justify-end"></div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-6 space-y-8">
        
        <!-- 區塊一：活動照片快速上傳 -->
        <section class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-emerald-100">
            <div class="flex items-center gap-2 mb-6">
                <i class="fas fa-images text-orange-500 text-2xl"></i>
                <div>
                    <h2 class="text-emerald-900 font-black text-lg">活動照片快速上傳</h2>
                    <p class="text-xs text-gray-500 font-bold mt-1">上傳後將儲存至專屬相簿，並同步呈現於首頁與跑馬燈中。</p>
                </div>
            </div>
            
            <input type="file" id="photoInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event, 'photo')">

            <div class="flex flex-col sm:flex-row gap-4 mt-8">
                <button onclick="document.getElementById('photoInput').click()" class="flex-[2] bg-emerald-50 text-emerald-800 border-2 border-emerald-200 py-4 px-6 rounded-2xl font-black text-sm hover:bg-emerald-100 transition active:scale-95 flex items-center justify-center gap-2 shadow-sm">
                    <i class="fas fa-folder-open text-emerald-600 text-lg"></i> 從裝置選取照片
                </button>
                <button id="uploadPhotoBtn" onclick="startUploadProcess('photo')" disabled class="flex-[3] bg-emerald-800 text-white py-4 px-6 rounded-2xl font-black text-sm shadow-md disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-cloud-upload-alt text-lg"></i> 批次送出至雲端
                </button>
            </div>

            <div id="photoStatus" class="mt-4 text-sm text-emerald-700 font-bold hidden bg-emerald-50 p-4 rounded-xl border border-emerald-100 text-center tracking-wide"></div>
        </section>

        <!-- 區塊二：導讀資料上傳 -->
        <section class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-emerald-100">
            <div class="flex items-center gap-2 mb-6">
                <i class="fas fa-book-reader text-blue-500 text-2xl"></i>
                <div>
                    <h2 class="text-emerald-900 font-black text-lg">導讀資料上傳 (PDF)</h2>
                    <p class="text-xs text-gray-500 font-bold mt-1">檔案將直接存入今年度的課程子目錄中。</p>
                </div>
            </div>
            
            <input type="file" id="pdfInput" accept=".pdf,application/pdf" multiple class="hidden" onchange="handleFileSelect(event, 'pdf')">

            <div class="flex flex-col sm:flex-row gap-4 mt-8">
                <button onclick="document.getElementById('pdfInput').click()" class="flex-[2] bg-blue-50 text-blue-800 border-2 border-blue-200 py-4 px-6 rounded-2xl font-black text-sm hover:bg-blue-100 transition active:scale-95 flex items-center justify-center gap-2 shadow-sm">
                    <i class="fas fa-file-pdf text-blue-600 text-lg"></i> 選擇 PDF 檔案
                </button>
                <button id="uploadPdfBtn" onclick="startUploadProcess('pdf')" disabled class="flex-[3] bg-blue-800 text-white py-4 px-6 rounded-2xl font-black text-sm shadow-md disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-cloud-upload-alt text-lg"></i> 送出導讀資料
                </button>
            </div>

            <div id="pdfStatus" class="mt-4 text-sm text-blue-700 font-bold hidden bg-blue-50 p-4 rounded-xl border border-blue-100 text-center tracking-wide"></div>
        </section>

        <!-- 區塊三：資源連結管理 -->
        <section class="bg-white rounded-[2rem] p-8 shadow-sm border border-emerald-100 mb-8">
            <h2 class="text-emerald-900 font-black mb-6 flex items-center gap-2 text-lg">
                <i class="fas fa-link text-orange-500"></i> 雲端目錄連結管理
            </h2>
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-emerald-700 mb-2 ml-1 italic">課程總資料庫 (reading_folder_url)</label>
                    <input type="text" id="reading_folder_url" class="w-full p-4 rounded-2xl border-2 border-emerald-50 outline-none focus:border-emerald-600 transition bg-gray-50/30" placeholder="歷年總資料庫網址...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-700 mb-2 ml-1 italic">今年度導讀子目錄 (upload_reading_folder_id)</label>
                    <input type="text" id="upload_reading_folder_id" class="w-full p-4 rounded-2xl border-2 border-emerald-50 outline-none focus:border-emerald-600 transition bg-gray-50/30" placeholder="上傳 PDF 檔案用的專屬子目錄...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-700 mb-2 ml-1 italic">活動剪影總覽 (photo_gallery_url)</label>
                    <input type="text" id="photo_gallery_url" class="w-full p-4 rounded-2xl border-2 border-emerald-50 outline-none focus:border-emerald-600 transition bg-gray-50/30" placeholder="Google Photos 或大總覽網址...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-700 mb-2 ml-1 italic">今年全螢幕相簿目錄 (marquee_folder_id)</label>
                    <input type="text" id="marquee_folder_id" class="w-full p-4 rounded-2xl border-2 border-emerald-50 outline-none focus:border-emerald-600 transition bg-gray-50/30" placeholder="跑馬燈與照片上傳用的專屬目錄...">
                </div>
            </div>
        </section>
        
    </div>

    <!-- 底部儲存按鈕 (僅針對資源連結) -->
    <div class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-emerald-100 p-4 z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
        <div class="max-w-4xl mx-auto">
            <button onclick="saveLinksSettings()" class="w-full py-4 rounded-2xl font-black text-white emerald-gradient shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-save"></i> 儲存雲端目錄連結設定
            </button>
        </div>
    </div>

    <!-- UI 元件：Loading 與 Toast -->
    <div id="loadingOverlay">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-emerald-900 font-bold" id="loadingText">處理中，請稍候...</p>
        </div>
    </div>
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-all pointer-events-none z-[2000]"></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxplbneiq3qt_4OeahaOkzhHh8meU0qYg9D5cXV8xDxYf1CT3m7y2SaDc7JZSgs6B8/exec";
        
        // 📦 1. 統一提取資料
        const auth = (function() {
            try {
                const info = JSON.parse(sessionStorage.getItem('userInfo')) || {};
                const loneKey = sessionStorage.getItem('staffKey'); 
                return {
                    key: info.staffKey || loneKey || "",
                    permissions: info.userPermissions || [],
                    isValid: !!(info.staffKey || loneKey)
                };
            } catch (e) {
                return { key: "", permissions: [], isValid: false };
            }
        })();

        const STAFF_KEY = auth.key;
        const userPermissions = auth.permissions;
        let selectedPhotos = [];
        let selectedPdfs = [];

        // UI 輔助功能
        function showLoading(show, text = "處理中，請稍候...") { 
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; 
        }
        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }

        // 網頁載入時執行
        window.onload = () => { 
            if (!STAFF_KEY) {
                alert("請重新登入");
                location.href = "index.html";
                return;
            }

            const hasConfigPermission = userPermissions.some(p => 
                p.trim().toLowerCase() === "all" || 
                p.trim().toLowerCase() === "manage_config"
            );
            
            if (!hasConfigPermission) {
                alert("⚠️ 您不具備管理雲端資料的權限，即將返回選單。");
                location.href = "staff_menu.html";
            } else {
                loadLinksSettings(); // 載入連結資料
            }
        };

        // --- 載入與儲存連結資料邏輯 ---
        async function loadLinksSettings() {
            showLoading(true, "載入連結設定中...");
            try {
                const res = await fetch(`${GAS_URL}?type=get_permission_settings&t=${Date.now()}`);
                const data = await res.json();
                const config = data.config || {};

                document.getElementById('reading_folder_url').value = config.reading_folder_url || '';
                document.getElementById('upload_reading_folder_id').value = config.upload_reading_folder_id || '';
                document.getElementById('photo_gallery_url').value = config.photo_gallery_url || '';
                document.getElementById('marquee_folder_id').value = config.marquee_folder_id || '';
            } catch (e) {
                showToast("❌ 無法連接資料庫讀取設定");
            }
            showLoading(false);
        }

        async function saveLinksSettings() {
            const payload = {
                type: 'update_permissions_and_links',
                key: STAFF_KEY,
                links: {
                    reading_folder_url: document.getElementById('reading_folder_url').value,
                    upload_reading_folder_id: document.getElementById('upload_reading_folder_id').value,
                    photo_gallery_url: document.getElementById('photo_gallery_url').value,
                    marquee_folder_id: document.getElementById('marquee_folder_id').value
                }
            };

            showLoading(true, "儲存設定中...");
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.result === "SUCCESS") {
                    showToast("✅ 雲端目錄連結設定已同步成功！");
                } else {
                    showToast("❌ 儲存失敗：" + result.message);
                }
            } catch (e) {
                showToast("❌ 伺服器連線異常");
            }
            showLoading(false);
        }

        // --- 檔案選擇與上傳邏輯 ---
        function handleFileSelect(event, type) {
            const files = Array.from(event.target.files);
            const statusEl = document.getElementById(type === 'photo' ? 'photoStatus' : 'pdfStatus');
            const uploadBtn = document.getElementById(type === 'photo' ? 'uploadPhotoBtn' : 'uploadPdfBtn');

            if (type === 'photo') selectedPhotos = files;
            if (type === 'pdf') selectedPdfs = files;

            const currentFiles = type === 'photo' ? selectedPhotos : selectedPdfs;
            const iconColor = type === 'photo' ? 'text-emerald-500' : 'text-blue-500';

            if (currentFiles.length > 0) {
                statusEl.innerHTML = `<i class="fas fa-check-circle mr-1 ${iconColor}"></i> 已選取 <b>${currentFiles.length}</b> 個檔案，點擊右側按鈕開始上傳。`;
                statusEl.classList.remove('hidden');
                uploadBtn.disabled = false;
            } else {
                statusEl.classList.add('hidden');
                uploadBtn.disabled = true;
            }
        }

        async function startUploadProcess(type) {
            const isPhoto = type === 'photo';
            const filesToUpload = isPhoto ? selectedPhotos : selectedPdfs;
            if (filesToUpload.length === 0) return;

            const statusEl = document.getElementById(isPhoto ? 'photoStatus' : 'pdfStatus');
            const actionType = isPhoto ? 'upload_activity_photo' : 'upload_reading_material';
            let successCount = 0;

            for (let i = 0; i < filesToUpload.length; i++) {
                const file = filesToUpload[i];
                showLoading(true, `上傳中... (${i + 1}/${filesToUpload.length})`);

                try {
                    const base64Data = await convertFileToBase64(file);
                    const payload = {
                        type: actionType,
                        key: STAFF_KEY,
                        fileName: file.name,
                        fileData: base64Data
                    };

                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();

                    if (result.result === 'SUCCESS') successCount++;
                } catch (err) {
                    console.error("上傳發生錯誤:", err);
                }
            }

            showLoading(false);
            
            if (successCount === filesToUpload.length) {
                showToast(`✅ 完美！${successCount} 個檔案全數上傳成功`);
            } else {
                showToast(`⚠️ 上傳完畢，成功 ${successCount} 個，失敗 ${filesToUpload.length - successCount} 個`);
            }

            // 清空狀態
            document.getElementById(isPhoto ? 'photoInput' : 'pdfInput').value = '';
            if (isPhoto) selectedPhotos = []; else selectedPdfs = [];
            document.getElementById(isPhoto ? 'uploadPhotoBtn' : 'uploadPdfBtn').disabled = true;
            statusEl.innerHTML = `<i class="fas fa-info-circle mr-1"></i> 上傳流程結束。`;
        }

        // 將 File 轉成 Base64 字串
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
