<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場直播控制台 - 築心讀書會</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #111827; }
    </style>
</head>
<body class="h-screen flex flex-col text-white">

    <nav class="bg-gray-900 p-4 shadow-lg flex justify-between items-center border-b border-gray-800">
        <div class="font-bold text-base text-emerald-400 flex items-center">
            <i class="fas fa-video mr-2"></i> 直播控制台
        </div>
        <div id="statusBadge" class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full text-xs font-bold flex items-center">
            <span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span> 準備中
        </div>
    </nav>

    <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
        <div class="w-full bg-black rounded-xl overflow-hidden relative shadow-2xl border border-gray-700 min-h-[300px]">
            <video id="localVideo" class="w-full h-full object-cover" autoplay muted playsinline></video>
            
            <button id="switchCamBtn" class="absolute top-3 right-3 bg-gray-900/80 hover:bg-gray-800 text-white p-3 rounded-full shadow-lg border border-gray-600 transition-all">
                <i class="fas fa-sync-alt text-base"></i>
            </button>

            <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-4 px-4">
                <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all flex items-center">
                    <i class="fas fa-play mr-2"></i> 開始直播
                </button>
                <button id="stopBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all hidden flex items-center">
                    <i class="fas fa-stop mr-2"></i> 結束直播
                </button>
            </div>
        </div>

        <div class="w-full bg-gray-800 rounded-xl flex flex-col border border-gray-700 shadow-xl overflow-hidden min-h-[150px]">
            <div class="bg-gray-900 p-3 border-b border-gray-700 font-bold text-emerald-300 flex justify-between items-center text-sm">
                <span>會員連線請求</span>
                <span id="requestCount" class="bg-emerald-900 text-emerald-300 text-xs px-2 py-1 rounded-full">0</span>
            </div>
            
            <div id="requestsContainer" class="p-3 space-y-2">
                <div class="text-gray-500 text-xs text-center py-4">等待會員要求加入...</div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, onChildAdded, onChildRemoved, onDisconnect, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBXyX-rBLxWvPAJaYWabv4skVEQQWftQ0A",
          authDomain: "chuxinclub.firebaseapp.com",
          databaseURL: "https://chuxinclub-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "chuxinclub",
          storageBucket: "chuxinclub.firebasestorage.app",
          messagingSenderId: "135254541508",
          appId: "1:135254541508:web:6fcdfade7bf596dfc13591"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const statusBadge = document.getElementById('statusBadge');
        const requestsContainer = document.getElementById('requestsContainer');
        const requestCount = document.getElementById('requestCount');

        let localStream = null;
        let currentFacingMode = "environment"; 
        const ROOM_ID = "main_room";
        const peerConnections = {};

        // 🌟 核心修復：退回穩定的 Google STUN，移除造成超時的 TURN 伺服器
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        async function initCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop()); 
            }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });
                localVideo.srcObject = localStream;
            } catch (error) {
                console.error("相機存取失敗:", error);
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    localVideo.srcObject = localStream;
                } catch (e) {
                    alert("無法取得相機權限：" + e.message);
                }
            }
        }

        switchCamBtn.addEventListener('click', async () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            await initCamera();
        });

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> 啟動中...`;

            try {
                if (!localStream || !localStream.active) await initCamera();

                const statusRef = ref(db, `rooms/${ROOM_ID}/status`);
                await set(statusRef, { isLive: true, startedAt: Date.now() });
                onDisconnect(statusRef).set({ isLive: false });

                startBtn.classList.add('hidden');
                startBtn.disabled = false;
                startBtn.innerHTML = `<i class="fas fa-play mr-2"></i> 開始直播`;
                stopBtn.classList.remove('hidden');

                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2 animate-pulse"></span> 直播中`;
                statusBadge.classList.replace('bg-gray-700', 'bg-red-900/50');
                statusBadge.classList.replace('text-gray-300', 'text-red-400');

                listenForRequests();
            } catch (err) {
                startBtn.disabled = false;
                startBtn.innerHTML = `<i class="fas fa-play mr-2"></i> 開始直播`;
                alert("開啟直播失敗！錯誤訊息：\n" + (err.message || err));
            }
        });

        stopBtn.addEventListener('click', async () => {
            const statusRef = ref(db, `rooms/${ROOM_ID}/status`);
            await set(statusRef, { isLive: false });

            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span> 準備中`;
            statusBadge.classList.replace('bg-red-900/50', 'bg-gray-700');
            statusBadge.classList.replace('text-red-400', 'text-gray-300');
            
            requestsContainer.innerHTML = '<div class="text-gray-500 text-xs text-center py-4">等待會員要求加入...</div>';
            requestCount.textContent = "0";

            for (let userId in peerConnections) {
                if (peerConnections[userId]) {
                    peerConnections[userId].close();
                    delete peerConnections[userId];
                }
            }
        });

        window.removeConnectedUserCard = (userId) => {
            const card = document.getElementById(`req-${userId}`);
            if (card) {
                card.remove();
                updateRequestCount(-1);
            }
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
            }
            remove(ref(db, `rooms/${ROOM_ID}/connections/${userId}`)).catch(()=>{});
        };

        window.disconnectUser = (userId) => {
            if (confirm("確定要強制中斷這位會員的連線嗎？")) window.removeConnectedUserCard(userId);
        };

        function listenForRequests() {
            const requestsRef = ref(db, `rooms/${ROOM_ID}/requests`);
            requestsContainer.innerHTML = '';

            onChildAdded(requestsRef, (snapshot) => {
                const request = snapshot.val();
                const userId = snapshot.key;

                if (document.getElementById(`req-${userId}`)) return;

                const card = document.createElement('div');
                card.id = `req-${userId}`;
                card.className = "bg-gray-700 p-2.5 rounded-lg flex justify-between items-center text-sm";
                card.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center mr-2 text-xs font-bold">
                            ${request.userName ? request.userName.charAt(0) : '會'}
                        </div>
                        <span class="font-bold text-gray-200">${request.userName || '匿名會員'}</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="acceptRequest('${userId}')" class="bg-emerald-600 hover:bg-emerald-500 w-7 h-7 rounded-full flex items-center justify-center">
                            <i class="fas fa-check text-xs"></i>
                        </button>
                        <button onclick="rejectRequest('${userId}')" class="bg-red-600 hover:bg-red-500 w-7 h-7 rounded-full flex items-center justify-center">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>
                `;
                requestsContainer.appendChild(card);
                updateRequestCount(1);
            });

            onChildRemoved(requestsRef, (snapshot) => {
                const userId = snapshot.key;
                const card = document.getElementById(`req-${userId}`);
                if (card && !peerConnections[userId]) {
                    card.remove();
                    updateRequestCount(-1);
                }
            });
        }

        window.acceptRequest = async (userId) => {
            const card = document.getElementById(`req-${userId}`);
            if (card) {
                const actionDiv = card.querySelector('.flex.gap-2');
                if (actionDiv) {
                    actionDiv.innerHTML = `
                        <span class="text-[10px] bg-emerald-600 text-white px-2 py-1 rounded-full flex items-center shadow-md">
                            <i class="fas fa-link mr-1"></i> 已連線
                        </span>
                        <button onclick="disconnectUser('${userId}')" class="bg-red-600 hover:bg-red-500 w-7 h-7 rounded-full flex items-center justify-center text-white shadow-md ml-1" title="強制斷線">
                            <i class="fas fa-phone-slash text-xs"></i>
                        </button>
                    `;
                }
            }

            const connectionRef = ref(db, `rooms/${ROOM_ID}/connections/${userId}`);
            await remove(connectionRef);

            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[userId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `rooms/${ROOM_ID}/connections/${userId}/candidateToViewer`), event.candidate.toJSON());
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                await set(ref(db, `rooms/${ROOM_ID}/connections/${userId}/offer`), {
                    type: offer.type,
                    sdp: offer.sdp
                });

                onValue(ref(db, `rooms/${ROOM_ID}/connections/${userId}/answer`), async (snapshot) => {
                    const answer = snapshot.val();
                    if (answer && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                });

                onChildAdded(ref(db, `rooms/${ROOM_ID}/connections/${userId}/candidateFromViewer`), async (snapshot) => {
                    const candidate = snapshot.val();
                    if (candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(candidate));
                        } catch (e) {
                            console.error("加入 ICE Candidate 失敗:", e);
                        }
                    }
                });

            } catch (err) {
                console.error("WebRTC Offer 建立失敗:", err);
            }

            await remove(ref(db, `rooms/${ROOM_ID}/requests/${userId}`));
        };

        window.rejectRequest = async (userId) => {
            await remove(ref(db, `rooms/${ROOM_ID}/requests/${userId}`));
        };

        function updateRequestCount(change) {
            let current = parseInt(requestCount.textContent);
            requestCount.textContent = current + change;
            if (requestsContainer.children.length === 0) {
                requestsContainer.innerHTML = '<div class="text-gray-500 text-xs text-center py-4">等待會員要求加入...</div>';
            }
        }

        initCamera();
    </script>
</body>
</html>
