<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經費簽核與總帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; }
        .emerald-gradient { background: linear-gradient(135deg, #064E3B 0%, #065F46 100%); }
        .tab-active { border-bottom: 4px solid #064E3B; color: #064E3B; font-weight: 900; }
        .tab-inactive { color: #9CA3AF; font-weight: 700; }
        #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body class="pb-32">

    <!-- 導航列 -->
    <nav class="emerald-gradient text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto grid grid-cols-3 items-center">
            <div class="flex justify-start">
               <button onclick="location.href='staff_menu.html'" class="text-sm font-bold flex items-center transition hover:text-emerald-200">
                   <i class="fas fa-chevron-left mr-1"></i>返回
               </button>
            </div>
            <div class="text-center whitespace-nowrap">
                <h1 class="font-black tracking-widest text-lg">財務與經費簽核</h1>
            </div>
            <div class="flex justify-end"></div>
        </div>
    </nav>

    <!-- 雙頁籤切換器 -->
    <div class="max-w-4xl mx-auto mt-4 px-4 flex border-b border-gray-200">
        <button id="tab-expense" onclick="switchTab('expense')" class="flex-1 py-4 text-center tab-active transition">
            <i class="fas fa-file-invoice-dollar mr-2"></i>支出請款申請
        </button>
        <button id="tab-income" onclick="switchTab('income')" class="flex-1 py-4 text-center tab-inactive transition hidden">
            <i class="fas fa-hand-holding-usd mr-2"></i>新增收入 (財務專用)
        </button>
    </div>

    <!-- 內容區塊 -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- 表單區塊 -->
        <section class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-emerald-100">
            <h2 id="formTitle" class="text-emerald-900 font-black mb-6 text-lg border-l-4 border-emerald-600 pl-3">新增支出請款</h2>
            
            <div class="space-y-5">
                <!-- 日期與經手人 (自動帶入) -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">日期</label>
                        <input type="date" id="recordDate" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-emerald-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">申請/經手人</label>
                        <input type="text" id="applicantName" readonly class="w-full p-3 rounded-xl border border-gray-200 bg-gray-100 text-gray-500 outline-none font-bold">
                    </div>
                </div>

                <!-- 項目類別與金額 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">項目類別</label>
                        <select id="recordCategory" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-emerald-500 font-bold">
                            <!-- 支出選項 (預設) -->
                            <option value="場地費" class="opt-expense">場地費</option>
                            <option value="講師費" class="opt-expense">講師費</option>
                            <option value="活動雜支" class="opt-expense">活動雜支</option>
                            <option value="幹部補助" class="opt-expense">幹部補助</option>
                            <option value="其他支出" class="opt-expense">其他支出</option>
                            <!-- 收入選項 (預設隱藏) -->
                            <option value="會員會費" class="opt-income hidden">會員會費</option>
                            <option value="個人捐款" class="opt-income hidden">個人捐款</option>
                            <option value="前期結餘" class="opt-income hidden">前期結餘</option>
                            <option value="其他收入" class="opt-income hidden">其他收入</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">金額 (NT$)</label>
                        <input type="number" id="recordAmount" min="0" placeholder="0" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-emerald-500 font-black text-emerald-700">
                    </div>
                </div>

                <!-- 說明摘要 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">說明/摘要 (細節敘述)</label>
                    <textarea id="recordDesc" rows="2" placeholder="請簡述款項用途..." class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-emerald-500 font-bold resize-none"></textarea>
                </div>

                <!-- 單據上傳 (僅支出時顯示) -->
                <div id="receiptSection" class="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                    <label class="flex items-center gap-2 cursor-pointer mb-3">
                        <input type="checkbox" id="hasReceipt" class="w-4 h-4 text-emerald-600 rounded" onchange="toggleReceiptInput()">
                        <span class="font-bold text-orange-800 text-sm">檢附單據 (啟動相機拍照)</span>
                    </label>
                    
                    <div id="receiptInputContainer" class="hidden">
                        <!-- capture="environment" 會優先呼叫手機後置鏡頭 -->
                        <input type="file" id="receiptFile" accept="image/*" capture="environment" class="hidden" onchange="previewReceipt(event)">
                        <button onclick="document.getElementById('receiptFile').click()" class="w-full py-3 bg-white border-2 border-dashed border-orange-300 text-orange-600 font-bold rounded-xl hover:bg-orange-50 transition flex items-center justify-center gap-2">
                            <i class="fas fa-camera"></i> 點擊拍照或選擇相片
                        </button>
                        <div id="receiptStatus" class="mt-2 text-xs font-bold text-emerald-600 hidden text-center"></div>
                    </div>
                </div>

                <!-- 送出按鈕 -->
                <button onclick="submitRecord()" class="w-full py-4 mt-4 bg-emerald-800 text-white rounded-xl font-black shadow-md active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> 送出資料
                </button>
            </div>
        </section>
    </div>

    <!-- UI 元件：Loading 與 Toast -->
    <div id="loadingOverlay">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-emerald-900 font-bold" id="loadingText">處理中，請稍候...</p>
        </div>
    </div>
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-all pointer-events-none z-[2000] whitespace-nowrap"></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxplbneiq3qt_4OeahaOkzhHh8meU0qYg9D5cXV8xDxYf1CT3m7y2SaDc7JZSgs6B8/exec";
        
        let currentMode = 'expense'; // 'expense' or 'income'
        let selectedReceiptBase64 = null;
        let selectedReceiptName = null;

        // 取得登入者資訊
        const auth = (function() {
            try {
                const info = JSON.parse(sessionStorage.getItem('userInfo')) || {};
                const loneKey = sessionStorage.getItem('staffKey'); 
                return {
                    key: info.staffKey || loneKey || "",
                    name: info.name || "測試幹部",
                    role: info.role || "幹部",
                    isValid: !!(info.staffKey || loneKey)
                };
            } catch (e) {
                return { key: "", name: "", role: "", isValid: false };
            }
        })();

        // 初始化頁面
        window.onload = () => {
            if (!auth.isValid) {
                alert("請先登入幹部系統");
                location.href = "index.html";
                return;
            }

            // 預設填入今日日期與申請人
            document.getElementById('recordDate').valueAsDate = new Date();
            document.getElementById('applicantName').value = auth.name;

            // 權限判定：只有財務可以看到「新增收入」Tab
            if (auth.role === '財務' || auth.role === '會長') {
                document.getElementById('tab-income').classList.remove('hidden');
            }
        };

        // UI 輔助功能
        function showLoading(show, text = "處理中...") { 
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; 
        }
        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }

        // 切換頁籤 (收入/支出)
        function switchTab(mode) {
            currentMode = mode;
            const tabExp = document.getElementById('tab-expense');
            const tabInc = document.getElementById('tab-income');
            const title = document.getElementById('formTitle');
            const receiptSec = document.getElementById('receiptSection');

            // 樣式切換
            if (mode === 'expense') {
                tabExp.className = "flex-1 py-4 text-center tab-active transition";
                tabInc.className = "flex-1 py-4 text-center tab-inactive transition";
                title.innerText = "新增支出請款";
                receiptSec.classList.remove('hidden');
            } else {
                tabInc.className = "flex-1 py-4 text-center tab-active transition";
                tabExp.className = "flex-1 py-4 text-center tab-inactive transition";
                title.innerText = "新增入帳紀錄";
                receiptSec.classList.add('hidden');
                // 收入不需要上傳單據，清空狀態
                document.getElementById('hasReceipt').checked = false;
                toggleReceiptInput();
            }

            // 切換下拉選單選項
            document.querySelectorAll('.opt-expense').forEach(el => el.classList.toggle('hidden', mode !== 'expense'));
            document.querySelectorAll('.opt-income').forEach(el => el.classList.toggle('hidden', mode !== 'income'));
            
            // 重置選單至該類別的第一個選項
            document.getElementById('recordCategory').selectedIndex = mode === 'expense' ? 0 : 5; 
        }

        // 切換單據上傳區塊顯示
        function toggleReceiptInput() {
            const isChecked = document.getElementById('hasReceipt').checked;
            const container = document.getElementById('receiptInputContainer');
            if (isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('receiptFile').value = '';
                selectedReceiptBase64 = null;
                document.getElementById('receiptStatus').classList.add('hidden');
            }
        }

        // 預覽與轉檔照片
        async function previewReceipt(event) {
            const file = event.target.files[0];
            const statusEl = document.getElementById('receiptStatus');
            
            if (file) {
                statusEl.innerText = `🔄 照片處理中...`;
                statusEl.classList.remove('hidden');
                try {
                    selectedReceiptBase64 = await convertFileToBase64(file);
                    selectedReceiptName = file.name;
                    statusEl.innerHTML = `<i class="fas fa-check-circle"></i> 已準備好單據照片 (${Math.round(file.size/1024)}KB)`;
                } catch (e) {
                    statusEl.innerHTML = `<span class="text-red-500">❌ 照片處理失敗</span>`;
                    selectedReceiptBase64 = null;
                }
            }
        }

        // 轉換 Base64 工具
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 送出表單
        async function submitRecord() {
            const date = document.getElementById('recordDate').value;
            const category = document.getElementById('recordCategory').value;
            const amount = document.getElementById('recordAmount').value;
            const desc = document.getElementById('recordDesc').value;
            const hasReceipt = document.getElementById('hasReceipt').checked;

            if (!date || !amount || amount <= 0) {
                alert("請填寫完整的日期與正確的金額！");
                return;
            }

            if (currentMode === 'expense' && hasReceipt && !selectedReceiptBase64) {
                alert("您勾選了檢附單據，請確實拍照或上傳檔案！");
                return;
            }

            const payload = {
                type: 'submit_finance_record',
                key: auth.key,
                recordType: currentMode === 'expense' ? '支出' : '收入',
                date: date,
                category: category,
                amount: amount,
                description: desc,
                applicantName: auth.name,
                hasReceipt: (currentMode === 'expense' && hasReceipt),
                fileData: selectedReceiptBase64,
                fileName: selectedReceiptName
            };

            showLoading(true, "資料傳送中，請勿關閉視窗...");

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.result === 'SUCCESS') {
                    showToast("✅ " + result.message);
                    // 清空表單
                    document.getElementById('recordAmount').value = '';
                    document.getElementById('recordDesc').value = '';
                    document.getElementById('hasReceipt').checked = false;
                    toggleReceiptInput();
                } else {
                    showToast("❌ 提交失敗：" + result.message);
                }
            } catch (err) {
                showToast("❌ 網路異常，請稍後再試");
            }

            showLoading(false);
        }
    </script>
</body>
</html>
