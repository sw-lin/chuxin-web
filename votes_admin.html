<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民調中心管理 | 築心會館</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; }
        
        #loadingOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; backdrop-filter: blur(2px);
        }
        .loading-card {
            background: white; padding: 40px; border-radius: 32px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #065F46; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 50px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 10000; pointer-events: none; }
        
        .form-input { @apply w-full p-4 bg-emerald-50/30 border-2 border-transparent rounded-2xl font-bold text-emerald-900 outline-none focus:border-emerald-600 transition-all mb-4; }
        .form-label { @apply text-[10px] text-emerald-800/50 font-black mb-1 px-1 uppercase tracking-widest block; }
        
        /* 唯讀模式樣式 */
        .read-only input, .read-only textarea, .read-only select {
            background-color: transparent !important;
            border-color: transparent !important;
            padding-left: 4px !important;
            pointer-events: none;
            color: #064E3B;
        }
        /* 隱藏原生 datetime-local 圖標 (可選) */
        input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="toast"></div>
    <div id="loadingOverlay"><div class="loading-card"><div class="spinner"></div><div class="text-emerald-900 font-bold text-lg">處理中...</div></div></div>

    <nav class="sticky top-0 z-40 bg-[#064e3b] text-white px-4 h-16 shadow-lg flex items-center justify-between">
        <button onclick="location.href='staff_menu.html'" class="text-sm font-bold flex items-center">
            <i class="fas fa-chevron-left mr-1"></i>返回
        </button>
        <h1 class="absolute inset-x-0 text-center text-lg font-black tracking-widest pointer-events-none">民調中心</h1>
        <button id="editToggleBtn" onclick="toggleEditMode()" class="bg-white/10 px-4 py-1.5 rounded-lg text-xs font-bold border border-white/20 transition-all active:scale-95">
            開啟編輯
        </button>
    </nav>

    <main class="p-4 max-w-2xl mx-auto">
        <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-emerald-50 mb-6">
            <label class="form-label">Select Vote Project</label>
            <div class="relative">
                <select id="voteSelector" onchange="handleVoteSelect()" class="w-full bg-emerald-50/50 p-4 pr-10 rounded-2xl text-base font-bold text-emerald-900 outline-none appearance-none border-2 border-transparent focus:border-emerald-600 transition-all">
                    <option value="">-- 請選擇調查項目 --</option>
                    <option value="NEW" class="text-emerald-600 font-black">+ 新增投票項目</option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-emerald-800/50">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </div>

        <div id="voteFormContainer" class="hidden space-y-6">
            <div id="mainForm" class="bg-white p-8 rounded-[2.5rem] shadow-md border border-emerald-100 read-only transition-all">
                
                <input type="hidden" id="voteId">

                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="form-label">投票標題 (Title)</label>
                        <input type="text" id="title" class="form-input" placeholder="例如：五月讀書會選書">
                    </div>

                    <div class="col-span-2">
                        <label class="form-label">詳細說明 (Description)</label>
                        <textarea id="description" rows="3" class="form-input" placeholder="請輸入活動詳細說明..."></textarea>
                    </div>

                    <div class="col-span-2">
                        <label class="form-label">海報圖片網址 (Poster URL)</label>
                        <input type="text" id="posterUrl" class="form-input" placeholder="https://...">
                    </div>

                    <div class="col-span-2 bg-emerald-50/20 p-4 rounded-3xl border border-emerald-50/50 mb-4">
                        <div class="flex items-center justify-between mb-4">
                            <label class="form-label !mb-0">投票選項設定</label>
                            <div class="flex items-center gap-2">
    <input type="text" 
           id="optionCountInput" 
           placeholder="輸入數量 (如: 10)" 
           oninput="handleOptionCountInput(this)"
           class="w-24 bg-white border-2 border-emerald-100 rounded-xl px-3 py-1.5 text-sm font-bold outline-none focus:border-emerald-600 text-center">
    <button onclick="applyOptionCount()" 
            class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-700 transition-all">
        生成欄位
    </button>
</div>
                        </div>
                        <div id="dynamicOptionsContainer" class="space-y-2">
                            </div>
                        <p class="text-[10px] text-emerald-600 mt-2 italic px-1">* 系統會自動刪除特殊符號並合併儲存</p>
                    </div>

                    <div>
                       <label class="form-label">投票類型 (Type)</label>
                       <select id="type" class="form-input h-[60px]" onchange="handleTypeChange()">
                       <option value="SINGLE">單選 (SINGLE)</option>
                       <option value="MULTIPLE">多選 (MULTIPLE)</option>
                    </select>
                    </div>

<div>
    <label class="form-label">最多選幾項</label>
    <input type="number" id="maxChoices" class="form-input h-[60px]" value="1" min="1">
</div>

                    <div>
                        <label class="form-label">開始時間</label>
                        <input type="datetime-local" id="startTime" class="form-input h-[60px]">
                    </div>

                    <div>
                        <label class="form-label">結束時間</label>
                        <input type="datetime-local" id="endTime" class="form-input h-[60px]">
                    </div>

                    <div>
                        <label class="form-label">活動開關 (Status)</label>
                        <select id="status" class="form-input h-[60px]">
                            <option value="OPEN">OPEN (開啟)</option>
                            <option value="CLOSED">CLOSED (關閉)</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">結果顯示 (Show Result)</label>
                        <select id="showResult" class="form-input h-[60px]">
                            <option value="ALWAYS">ALWAYS (投完即看)</option>
                            <option value="HIDE">HIDE (結束才看)</option>
                        </select>
                    </div>

                    <div class="col-span-2">
                        <label class="form-label">實名制設定 (Anonymous)</label>
                        <select id="anonymous" class="form-input h-[60px]">
                            <option value="FALSE">FALSE (實名/記名投票)</option>
                            <option value="TRUE">TRUE (不記名投票)</option>
                        </select>
                    </div>
                </div>

                <div id="saveAction" class="hidden mt-8">
                    <button onclick="saveVoteData()" class="w-full bg-[#064E3B] text-white py-5 rounded-[2.5rem] font-black text-xl shadow-xl active:scale-95 transition-all">
                        儲存變更
                    </button>
                    <button id="deleteBtn" onclick="deleteVote()" class="w-full mt-4 text-red-500 font-bold text-sm">
                        刪除此投票活動
                    </button>
                </div>
            </div>
        </div>

        <div id="emptyHint" class="py-20 text-center text-gray-400 italic">
            <i class="fas fa-poll-h text-4xl mb-4 block opacity-20"></i>
            請由上方選單選取或建立投票項目
        </div>

    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbymlOJwVkQKdFMMVc9tmLgNxraaSaG3fOksPQk7hpYybGC8p6Auzk6NpJffiDDcYrlq/exec"; 
        
        const auth = (function() {
            try {
                const info = JSON.parse(sessionStorage.getItem('userInfo')) || {};
                const loneKey = sessionStorage.getItem('staffKey'); 
                return {
                    key: info.staffKey || loneKey || "",
                    permissions: info.userPermissions || [],
                };
            } catch (e) { return { key: "", permissions: [] }; }
        })();

        let allVotes = [];
        let isEditMode = false;
        const STAFF_KEY = auth.key;
        const hasPermission = auth.permissions.includes("all") || auth.permissions.includes("manage_votes");

        window.onload = () => {
            if (!STAFF_KEY) { location.href = "index.html"; return; }
            if (!hasPermission) { document.getElementById('editToggleBtn').style.display = 'none'; }
            fetchVoteList();
        };

        async function fetchVoteList() {
            toggleLoading(true);
            try {
                const res = await fetch(`${GAS_URL}?type=get_admin_votes&key=${STAFF_KEY}`);
                const data = await res.json();
                allVotes = data.data || [];
                renderSelector();
            } finally { toggleLoading(false); }
        }

        // 修改 1: 下拉選單只顯示 Title
        function renderSelector() {
            const selector = document.getElementById('voteSelector');
            const currentVal = selector.value;
            let html = '<option value="">-- 請選擇調查項目 --</option>';
            allVotes.forEach(v => {
                html += `<option value="${v.voteId}">${v.title}</option>`;
            });
            html += '<option value="NEW" class="text-emerald-600 font-black">+ 新增投票項目</option>';
            selector.innerHTML = html;
            if (currentVal) selector.value = currentVal;
        }

        // 修改 2: 動態產生選項欄位
        function generateOptionInputs(count, values = []) {
            const container = document.getElementById('dynamicOptionsContainer');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const val = values[i] ? values[i].trim() : '';
                container.innerHTML += `
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-emerald-800/30 w-6">0${i+1}</span>
                        <input type="text" class="option-field flex-1 p-3 bg-white border border-emerald-100 rounded-xl text-sm font-bold text-emerald-900 outline-none focus:border-emerald-600" 
                               placeholder="請輸入選項內容" value="${val}">
                    </div>
                `;
            }
        }

        function handleVoteSelect() {
            const val = document.getElementById('voteSelector').value;
            const container = document.getElementById('voteFormContainer');
            const hint = document.getElementById('emptyHint');
            
            if (!val) {
                container.classList.add('hidden');
                hint.classList.remove('hidden');
                return;
            }

            hint.classList.add('hidden');
            container.classList.remove('hidden');

            if (val === "NEW") {
                clearForm();
                if (!isEditMode) toggleEditMode();
            } else {
                const vote = allVotes.find(v => v.voteId === val);
                fillForm(vote);
            }
        }

        // 修改 3: 格式化時間與選項填充
        function fillForm(v) {
            document.getElementById('voteId').value = v.voteId;
            document.getElementById('title').value = v.title;
            document.getElementById('description').value = v.description;
            document.getElementById('posterUrl').value = v.posterUrl;
            
            // 處理選項
            const optList = v.options ? v.options.split(',') : [];
            // 🌟 修正點：改為對應目前的輸入框 ID
            const countInput = document.getElementById('optionCountInput');
            if (countInput) countInput.value = optList.length;            
            generateOptionInputs(optList.length, optList);

            document.getElementById('type').value = v.type;
            document.getElementById('maxChoices').value = v.maxChoices;
            
            // 處理時間格式 (YYYY-MM-DDTHH:MM)
            if(v.startTime) document.getElementById('startTime').value = v.startTime.replace(' ', 'T');
            if(v.endTime) document.getElementById('endTime').value = v.endTime.replace(' ', 'T');
            
            document.getElementById('status').value = v.status;
            document.getElementById('showResult').value = v.showResult;
            
            document.getElementById('anonymous').value = v.anonymous;
            handleTypeChange(); // 新增：填充完資料後執行一次，確保單選框狀態正確
            document.getElementById('deleteBtn').classList.remove('hidden');
        }

        function clearForm() {
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(i => i.value = "");
            document.getElementById('voteId').value = "V" + Date.now();
            document.getElementById('optionCountInput').value = ""; // 清空輸入框
            document.getElementById('dynamicOptionsContainer').innerHTML = '';
            document.getElementById('optionCountSelector').value = "0";
            document.getElementById('status').value = "OPEN";
            document.getElementById('type').value = "SINGLE";
            document.getElementById('maxChoices').value = "1";
            document.getElementById('showResult').value = "ALWAYS";
            document.getElementById('anonymous').value = "FALSE";
            document.getElementById('deleteBtn').classList.add('hidden');
        }

        function toggleEditMode() {
            if (!hasPermission) { showToast("⚠️ 您沒有管理權限"); return; }
            isEditMode = !isEditMode;
            const btn = document.getElementById('editToggleBtn');
            const form = document.getElementById('mainForm');
            const saveBtn = document.getElementById('saveAction');

            if (isEditMode) {
                btn.innerText = "取消編輯";
                btn.classList.replace('bg-white/10', 'bg-red-500');
                form.classList.remove('read-only');
                saveBtn.classList.remove('hidden');
            } else {
                btn.innerText = "開啟編輯";
                btn.classList.replace('bg-red-500', 'bg-white/10');
                form.classList.add('read-only');
                saveBtn.classList.add('hidden');
            }
        }

        // 修改 4: 儲存時清理選項與格式化時間
        async function saveVoteData() {
            // 清理並合併選項
            const optInputs = document.querySelectorAll('.option-field');
            const optValues = Array.from(optInputs)
                                   .map(i => i.value.trim().replace(/[,]/g, '')) // 刪除逗號防錯
                                   .filter(v => v !== "");
            
            if (optValues.length < 2) { alert("請至少填寫兩個有效選項！"); return; }

            const voteData = {
                id: document.getElementById('voteId').value,
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value,
                posterUrl: document.getElementById('posterUrl').value,
                options: optValues.join(','),
                // --- 補上以下兩行 ---
                type: document.getElementById('type').value,
                maxChoices: document.getElementById('maxChoices').value,
                // ------------------                
                startTime: document.getElementById('startTime').value.replace('T', ' '),
                endTime: document.getElementById('endTime').value.replace('T', ' '),
                status: document.getElementById('status').value,
                showResult: document.getElementById('showResult').value,
                isAnonymous: document.getElementById('anonymous').value
            };

            const payload = {
                type: 'save_vote_config',
                key: STAFF_KEY,
                voteData: voteData
            };

            if (!voteData.title) { alert("標題為必填！"); return; }

            toggleLoading(true);
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (result.result === "SUCCESS") {
                    showToast("✅ 儲存成功");
                    await fetchVoteList();
                    document.getElementById('voteSelector').value = result.newId || voteData.id;
                    handleVoteSelect();
                    toggleEditMode();
                }
            } catch (e) { showToast("❌ 儲存失敗"); }
            finally { toggleLoading(false); }
        }

        async function deleteVote() {
            const vid = document.getElementById('voteId').value;
            if (!confirm(`確定要永久刪除此活動嗎？`)) return;
            toggleLoading(true);
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: 'delete_vote', voteId: vid, key: STAFF_KEY })
                });
                showToast("🗑️ 已刪除");
                await fetchVoteList();
                document.getElementById('voteSelector').value = "";
                handleVoteSelect();
            } finally { toggleLoading(false); }
        }

        function toggleLoading(s) { document.getElementById('loadingOverlay').style.display = s ? 'flex' : 'none'; }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }
        // 新增此函式：處理單選/多選連動
function handleTypeChange() {
    const type = document.getElementById('type').value;
    const maxInput = document.getElementById('maxChoices');
    
    if (type === 'SINGLE') {
        // 如果是單選，強制設為 1 並禁用輸入
        maxInput.value = 1;
        maxInput.readOnly = true; 
        maxInput.style.backgroundColor = "#F3F4F6"; // 變灰色提示不可點
    } else {
        // 如果是多選，開放輸入，並確保預設值至少為 2
        maxInput.readOnly = false;
        maxInput.style.backgroundColor = ""; 
        if (parseInt(maxInput.value) <= 1) {
            maxInput.value = 2;
        }
    }
}
// 🌟 1. 自動將全形數字轉為半形，並限制只能輸入數字
function handleOptionCountInput(input) {
    // 全形數字轉半形邏輯
    let value = input.value.replace(/[０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });
    // 去除非數字字元
    value = value.replace(/[^\d]/g, '');
    input.value = value;
}

// 🌟 2. 執行生成欄位的動作
function applyOptionCount() {
    const input = document.getElementById('optionCountInput');
    let count = parseInt(input.value);

    if (isNaN(count) || count <= 0) {
        alert("請輸入正確的選項數量！");
        return;
    }

    if (count > 50) { // 設定一個保險上限，避免頁面崩潰
        if(!confirm("產生的選項數量較多，確定要繼續嗎？")) return;
    }

    // 呼叫您原本就有的生成函式
    generateOptionInputs(count);
    showToast(`✅ 已生成 ${count} 個選項`);
}
    </script>
</body>
</html>
