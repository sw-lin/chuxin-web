<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>財務管理與經費簽核</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; }
        .emerald-gradient { background: linear-gradient(135deg, #064E3B 0%, #065F46 100%); }
        .tab-active { border-bottom: 4px solid #064E3B; color: #064E3B; font-weight: 900; }
        .tab-inactive { color: #9CA3AF; font-weight: 700; }
        #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
    <link rel="icon" type="image/png" href="favicon-32x32.png?v=2" sizes="32x32" />
</head>
<body class="pb-32">

    <!-- 導航列 -->
    <nav class="emerald-gradient text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-5xl mx-auto grid grid-cols-3 items-center">
            <div class="flex justify-start">
               <button onclick="location.href='staff_menu.html'" class="text-sm font-bold flex items-center transition hover:text-emerald-200">
                   <i class="fas fa-chevron-left mr-1"></i>返回選單
               </button>
            </div>
            <div class="text-center whitespace-nowrap">
                <h1 class="font-black tracking-widest text-lg">財務管理與簽核</h1>
            </div>
            <div class="flex justify-end">
                <button onclick="loadRecords()" class="text-xs bg-emerald-800/80 hover:bg-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-500/50 transition shadow-sm">
                    <i class="fas fa-sync-alt mr-1"></i>重新整理
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">

        <!-- 💰 頂部財務儀表板 -->
        <section class="grid grid-cols-3 gap-3 md:gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 text-center">
                <span class="text-[11px] font-bold text-gray-400 block mb-1">總收入</span>
                <span id="statIncome" class="text-lg md:text-2xl font-black text-emerald-600">NT$ 0</span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-red-100 text-center">
                <span class="text-[11px] font-bold text-gray-400 block mb-1">總支出</span>
                <span id="statExpense" class="text-lg md:text-2xl font-black text-red-500">NT$ 0</span>
            </div>
            <div class="bg-emerald-900 text-white p-4 rounded-2xl shadow-sm text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                <span class="text-[11px] font-bold text-emerald-200 block mb-1 relative z-10">目前結餘</span>
                <span id="statBalance" class="text-lg md:text-2xl font-black text-amber-300 relative z-10">NT$ 0</span>
            </div>
        </section>

        <!-- 📑 頁籤切換器 -->
        <div class="flex border-b border-gray-200 bg-white rounded-t-2xl">
            <button id="tab-list" onclick="switchView('list')" class="flex-1 py-4 text-center tab-active transition">
                <i class="fas fa-list-alt mr-2"></i>收支明細與簽核
            </button>
            <button id="tab-apply" onclick="switchView('apply')" class="flex-1 py-4 text-center tab-inactive transition">
                <i class="fas fa-plus-circle mr-2"></i>填寫請款 / 入帳
            </button>
        </div>

        <!-- 🔴 視圖一：財務明細列表與簽核專區 -->
        <div id="view-list" class="space-y-4 relative pb-8">
            <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <div class="flex gap-2">
                    <button onclick="filterRecords('all')" class="filter-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-emerald-800 text-white" data-type="all">全部</button>
                    <button onclick="filterRecords('pending')" class="filter-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200" data-type="pending">待處理</button>
                    <button onclick="filterRecords('收入')" class="filter-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200" data-type="收入">僅收入</button>
                    <button onclick="filterRecords('支出')" class="filter-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200" data-type="支出">僅支出</button>
                </div>
                <span id="recordCount" class="text-xs font-bold text-gray-400 bg-gray-50 px-3 py-1 rounded-full border border-gray-100">共 0 筆紀錄</span>
            </div>

            <!-- 紀錄清單容器 -->
            <div id="recordsContainer" class="space-y-4">
                <div class="text-center py-12 text-gray-400 font-bold">載入資料中...</div>
            </div>
            
            <div id="reportBtnContainer" class="hidden mt-8 flex justify-center">
                <button onclick="openReportModal()" class="bg-[#064E3B] text-white px-8 py-3.5 rounded-2xl font-black shadow-lg hover:bg-emerald-800 active:scale-95 transition-all flex items-center gap-2 border border-emerald-700">
                    <i class="fas fa-file-excel"></i> 產生期末財務結算報表
                </button>
            </div>
        </div>

        <!-- 🔴 視圖二：填寫請款 / 收入表單 -->
        <div id="view-apply" class="hidden space-y-6">
            <div id="incomeTabContainer" class="flex bg-gray-100 p-1.5 rounded-2xl gap-2">
                <button id="subtab-expense" onclick="switchApplyMode('expense')" class="flex-1 py-2.5 rounded-xl font-black text-sm bg-white shadow-sm text-emerald-900 transition-all">
                    <i class="fas fa-file-invoice-dollar mr-1"></i>支出請款
                </button>
                <button id="subtab-income" onclick="switchApplyMode('income')" class="flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 hidden hover:text-emerald-700 transition-all">
                    <i class="fas fa-hand-holding-usd mr-1"></i>新增收入 (財務專用)
                </button>
            </div>

            <section class="bg-white rounded-[2rem] p-6 shadow-sm border border-emerald-100">
                <h2 id="formTitle" class="text-emerald-900 font-black mb-6 text-base border-l-4 border-emerald-600 pl-3">新增支出請款</h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">日期</label>
                            <input type="date" id="recordDate" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-emerald-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">申請/經手人</label>
                            <input type="text" id="applicantName" readonly class="w-full p-3 rounded-xl border border-gray-200 bg-gray-100 text-gray-500 font-bold text-sm outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">項目類別</label>
                            <select id="recordCategory" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-emerald-500 transition"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">金額 (NT$)</label>
                            <input type="number" id="recordAmount" min="0" placeholder="0" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-black text-sm text-emerald-700 outline-none focus:border-emerald-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">說明/摘要 (細節敘述)</label>
                        <textarea id="recordDesc" rows="2" placeholder="請簡述款項用途..." class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-emerald-500 resize-none transition"></textarea>
                    </div>

                    <div id="receiptSection" class="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                        <label class="flex items-center gap-2 cursor-pointer mb-2 w-max">
                            <input type="checkbox" id="hasReceipt" class="w-4 h-4 text-emerald-600 rounded" onchange="toggleReceiptInput()">
                            <span class="font-bold text-orange-800 text-sm">檢附單據 (拍照上傳)</span>
                        </label>
                        
                        <div id="receiptInputContainer" class="hidden mt-2">
                            <input type="file" id="receiptFile" accept="image/*" capture="environment" class="hidden" onchange="previewReceipt(event)">
                            <button onclick="document.getElementById('receiptFile').click()" class="w-full py-3 bg-white border-2 border-dashed border-orange-300 text-orange-600 font-bold text-xs rounded-xl hover:bg-orange-50 transition flex items-center justify-center gap-2">
                                <i class="fas fa-camera"></i> 拍照或選取照片
                            </button>
                            <div id="receiptStatus" class="mt-2 text-xs font-bold text-emerald-600 hidden text-center"></div>
                        </div>
                    </div>

                    <button onclick="submitRecord()" class="w-full py-3.5 bg-emerald-800 text-white rounded-xl font-black text-sm shadow-md hover:bg-emerald-700 active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i> 儲存並送出
                    </button>
                </div>
            </section>
        </div>
    </div>

    <!-- UI 元件：Loading 與 Toast -->
    <div id="loadingOverlay">
        <div class="flex flex-col items-center gap-4 bg-white/90 p-6 rounded-2xl shadow-xl">
            <div class="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-emerald-900 font-black text-sm tracking-wider" id="loadingText">處理中，請稍候...</p>
        </div>
    </div>
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-6 py-3 rounded-full text-xs font-bold opacity-0 transition-all pointer-events-none z-[2000] whitespace-nowrap shadow-lg"></div>

    <!-- 🌟 修改財務紀錄彈窗 (內含作廢功能) -->
    <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[100] items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex items-center justify-between mb-6 border-l-4 border-blue-500 pl-3">
                <div class="flex items-center gap-2">
                    <i class="fas fa-edit text-blue-500 text-lg"></i>
                    <h3 class="text-lg font-black text-gray-800">修改財務紀錄</h3>
                </div>
                <span id="editModalStatusBadge" class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-gray-100 text-gray-600"></span>
            </div>
            
            <input type="hidden" id="editRowIndex">
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 mb-1">日期</label>
                        <input type="date" id="editDate" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 mb-1">項目類別</label>
                        <select id="editCategory" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-blue-500 transition"></select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-500 mb-1">金額 (NT$)</label>
                    <input type="number" id="editAmount" min="0" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-black text-base text-blue-700 outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-500 mb-1">說明/摘要</label>
                    <textarea id="editDesc" rows="2" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-bold text-sm outline-none focus:border-blue-500 resize-none transition"></textarea>
                </div>
                
                <div class="text-[10px] text-orange-600 font-bold bg-orange-50 p-2.5 rounded-xl border border-orange-100">
                    <i class="fas fa-info-circle mr-1"></i> 修改紀錄將會自動寫入 P/Q 欄歷程中備查。
                </div>

                <!-- 主要操作按鈕 (取消與確認修改) -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="closeEditModal()" class="py-3 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl font-bold text-sm transition">取消</button>
                    <button onclick="submitEditAction()" class="py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-sm shadow-md transition">確認修改</button>
                </div>

                <!-- 🌟 額外加入的作廢按鈕 (僅在「待會長核准」或管理員權限時顯示) -->
                <div id="modalCancelContainer" class="pt-2 border-t border-gray-100 mt-3 hidden">
                    <button onclick="triggerCancelFromEditModal()" class="w-full py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 border border-red-200">
                        <i class="fas fa-ban"></i> 直接作廢此筆請款單
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 自訂作廢說明彈窗 (對應 P 欄說明) -->
    <div id="cancelModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[100] items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-black text-red-600 text-center">⚠️ 確定要作廢此筆紀錄？</h3>
            <p class="text-xs text-gray-500 text-center">請輸入作廢/取消說明（將寫入審核說明欄）：</p>

            <input type="hidden" id="cancelRowIndex">
            <textarea id="cancelReasonInput" rows="3" class="w-full p-3 bg-red-50/30 border border-red-100 rounded-2xl text-sm font-bold focus:outline-none focus:border-red-400 transition resize-none" placeholder="填寫作廢原因..."></textarea>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeCancelModal()" class="py-3 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl font-bold text-sm transition">取消</button>
                <button onclick="submitCancelAction()" class="py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-black text-sm shadow-md transition">確認作廢</button>
            </div>
        </div>
    </div>

    <!-- 🌟 報表彈窗 -->
    <div id="reportModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[100] items-center justify-center p-4 md:p-6">
        <div class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-emerald-900 p-4 text-center relative">
                <h3 class="text-lg font-black text-white tracking-widest">財務結算總表</h3>
                <button onclick="closeReportModal()" class="absolute right-4 top-1/2 -translate-y-1/2 text-emerald-200 hover:text-white text-xl transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto bg-[#FDFBF7]" id="reportContent"></div>
            <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-center gap-4">
                <button onclick="downloadCSV()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm transition active:scale-95 flex items-center gap-2">
                    <i class="fas fa-download"></i>匯出 Excel
                </button>
                <button onclick="closeReportModal()" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxplbneiq3qt_4OeahaOkzhHh8meU0qYg9D5cXV8xDxYf1CT3m7y2SaDc7JZSgs6B8/exec";
        
        let allRecords = [];
        let currentFilter = 'all';
        let applyMode = 'expense';
        let selectedReceiptBase64 = null;
        let selectedReceiptName = null;

        const expenseCategoryMap = {
            "會長": ["場地費用", "幹部補助", "其他"],
            "企劃": ["講演費用", "導讀開會補貼", "選書小禮物", "其他"],
            "活動": ["活動場地費", "活動雜支", "會員活動補助", "活動探勘補助", "期末聚餐補助", "其他"],
            "班務": ["講員茶水雜支", "全勤獎金", "其他"],
            "文書": ["文書雜支", "其他"],
          //  "財務": ["匯費手續費", "其他"]
        };

        const auth = (function() {
            try {
                const info = JSON.parse(sessionStorage.getItem('userInfo')) || {};
                const loneKey = sessionStorage.getItem('staffKey'); 
                return {
                    key: info.staffKey || loneKey || "",
                    name: info.name || info.userName || "幹部",
                    role: info.role || "幹部",
                    isValid: !!(info.staffKey || loneKey)
                };
            } catch (e) {
                return { key: "", name: "幹部", role: "幹部", isValid: false };
            }
        })();

        window.onload = () => {
            if (!auth.isValid) {
                alert("請先驗證幹部身分");
                location.href = "index.html";
                return;
            }

            document.getElementById('recordDate').valueAsDate = new Date();
            document.getElementById('applicantName').value = auth.name;

            if (auth.role === '財務' || auth.role === '會長') {
                document.getElementById('subtab-income').classList.remove('hidden');
                document.getElementById('reportBtnContainer').classList.remove('hidden');
            }
            switchApplyMode('expense'); 
            loadRecords();
        };

        function switchView(view) {
            document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
            document.getElementById('view-apply').classList.toggle('hidden', view !== 'apply');
            
            document.getElementById('tab-list').className = view === 'list' ? 'flex-1 py-4 text-center tab-active transition' : 'flex-1 py-4 text-center tab-inactive transition';
            document.getElementById('tab-apply').className = view === 'apply' ? 'flex-1 py-4 text-center tab-active transition' : 'flex-1 py-4 text-center tab-inactive transition';

            if (view === 'list') loadRecords();
        }

        async function loadRecords() {
            showLoading(true, "讀取財務資料中...");
            try {
                const payload = {
                    type: 'get_finance_records',
                    key: auth.key
                };

                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result && result.result === 'SUCCESS') {
                    allRecords = result.records || [];
                    calculateSummary();
                    renderRecords();
                } else {
                    const errorMsg = (result && result.message) ? result.message : "未知錯誤";
                    showToast("❌ 讀取失敗：" + errorMsg);
                    document.getElementById('recordsContainer').innerHTML = 
                        `<div class="text-center py-12 text-red-400 font-bold bg-red-50 rounded-2xl">載入失敗：${errorMsg}</div>`;
                }
            } catch (err) {
                console.error("載入紀錄失敗:", err);
                showToast("❌ 伺服器連線失敗");
                document.getElementById('recordsContainer').innerHTML = 
                    `<div class="text-center py-12 text-red-400 font-bold bg-red-50 rounded-2xl">連線失敗，請稍後再試</div>`;
            }
            showLoading(false);
        }

        function calculateSummary() {
            let totalIncome = 0;
            let totalExpense = 0;

            allRecords.forEach(r => {
                const amt = Number(r.amount) || 0;
                if (r.status !== '已作廢') {
                    if (r.type === '收入') {
                        totalIncome += amt;
                    } else if (r.type === '支出' && r.status === '已結案') {
                        totalExpense += amt;
                    }
                }
            });

            document.getElementById('statIncome').innerText = `NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('statExpense').innerText = `NT$ ${totalExpense.toLocaleString()}`;
            document.getElementById('statBalance').innerText = `NT$ ${(totalIncome - totalExpense).toLocaleString()}`;
        }

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            let filtered = allRecords;

            if (currentFilter === 'pending') {
                filtered = allRecords.filter(r => r.type === '支出' && r.status !== '已結案' && r.status !== '已作廢');
            } else if (currentFilter === '收入' || currentFilter === '支出') {
                filtered = allRecords.filter(r => r.type === currentFilter);
            }

            document.getElementById('recordCount').innerText = `共 ${filtered.length} 筆紀錄`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white py-12 rounded-2xl text-center text-gray-400 font-bold border border-gray-100 shadow-sm"><i class="fas fa-inbox text-3xl mb-3 text-gray-200 block"></i>目前尚無相關紀錄</div>`;
                return;
            }

            let html = '';
            filtered.forEach(r => {
                const isIncome = r.type === '收入';
                const isCanceled = r.status === '已作廢';
                const isClosed = r.status === '已結案';

                let statusColor = 'bg-amber-100 text-amber-800 animate-pulse';
                if (isClosed) statusColor = 'bg-emerald-100 text-emerald-800';
                if (isCanceled) statusColor = 'bg-gray-200 text-gray-500 line-through';

                let actionBtnHtml = '';
                if (!isCanceled) {
                    if (!isIncome) {
                        if (r.status === '待會長核准' && (auth.role === '會長')) {
                            actionBtnHtml += `<button onclick="updateStatus(${r.rowIndex}, 'approve')" class="mt-2 text-[11px] font-bold bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl shadow-sm transition mr-1"><i class="fas fa-check mr-1"></i>核准</button>`;
                        } else if (r.status === '待財務撥款' && auth.role === '財務') {
                            actionBtnHtml += `<button onclick="updateStatus(${r.rowIndex}, 'fund')" class="mt-2 text-[11px] font-bold bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl shadow-sm transition mr-1"><i class="fas fa-hand-holding-usd mr-1"></i>撥款</button>`;
                        } else if (r.status === '待申請人簽收' && (auth.name === r.applicant || auth.role === '會長')) {
                            actionBtnHtml += `<button onclick="updateStatus(${r.rowIndex}, 'sign')" class="mt-2 text-[11px] font-bold bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-xl shadow-sm transition mr-1"><i class="fas fa-signature mr-1"></i>簽收結案</button>`;
                        }
                    }

                    // 🌟 升級：提供修改按鈕 (只要尚未結案/作廢，且身分相符)
                    if (!isClosed && (auth.name === r.applicant || auth.role === '會長' || auth.role === '財務')) {
                        actionBtnHtml += `<button onclick="openEditModal(${r.rowIndex})" class="mt-2 text-[11px] font-bold bg-gray-50 hover:bg-gray-100 text-blue-600 border border-blue-100 px-3 py-1.5 rounded-xl transition mr-1"><i class="fas fa-edit"></i></button>`;
                    }

                    // 權限作廢
                  //  if (auth.role === '財務' || auth.role === '會長') {
                  //      actionBtnHtml += `<button onclick="triggerCancel(${r.rowIndex})" class="mt-2 text-[11px] font-bold bg-gray-50 hover:bg-red-50 text-red-500 border border-red-100 px-3 py-1.5 rounded-xl transition"><i class="fas fa-ban"></i></button>`;
                  //  }
                    
                    // ⚠️ 舊的卡片外層作廢按鈕已移除，改由進階「修改彈窗」內統一處理！
                }

                const receiptBtnHtml = r.receiptUrl ? `<a href="${r.receiptUrl}" target="_blank" class="text-[10px] text-orange-600 font-bold bg-orange-50 px-2.5 py-1 rounded-lg border border-orange-200 hover:bg-orange-100 transition inline-flex items-center gap-1"><i class="fas fa-receipt"></i>單據</a>` : '';
                
                // 🌟 升級：讀取 P 欄作廢說明 與 Q 欄歷程軌跡 (如有對應資料)
                // 假設您的後端 API 傳回 r.auditNote (對應P欄) 與 r.historyLog (對應Q欄)
                const cancelReasonText = r.cancelNote || r.auditNote; // 兼容舊版與新版欄位
                const cancelNoteHtml = (isCanceled && cancelReasonText) ? `<div class="text-[11px] text-red-500 font-bold mt-2 bg-red-50/80 p-2 rounded-lg border border-red-100/50"><i class="fas fa-exclamation-circle mr-1"></i>作廢原因：${cancelReasonText}</div>` : '';
                const historyHtml = r.historyLog ? `<div class="text-[10px] text-gray-400 mt-2 pt-2 border-t border-gray-50 leading-relaxed font-semibold"><i class="fas fa-history mr-1 opacity-70"></i>${r.historyLog.replace(/\n/g, '<br>')}</div>` : '';

                html += `
                    <div class="bg-white p-4 rounded-[1.25rem] border border-gray-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3 ${isCanceled ? 'opacity-60 bg-gray-50/50' : 'hover:border-emerald-200 transition-colors'}">
                        <div class="space-y-1.5 w-full md:w-auto flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-[10px] font-black px-2 py-0.5 rounded-md ${isIncome ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'}">${r.type}</span>
                                <span class="font-black text-gray-800 text-sm ${isCanceled ? 'line-through text-gray-400' : ''}">${r.category}</span>
                                <span class="text-[10px] text-gray-400 font-bold tracking-wider">(${r.id})</span>
                            </div>
                            <div class="text-xs text-gray-600 font-bold leading-relaxed">${r.desc || '無摘要說明'}</div>
                            <div class="text-[10px] text-gray-400 flex items-center gap-3 font-semibold">
                                <span><i class="far fa-calendar-alt mr-1"></i>${r.date}</span>
                                <span><i class="far fa-user mr-1"></i>${r.applicant}</span>
                            </div>
                            ${cancelNoteHtml}
                            ${historyHtml}
                        </div>

                        <div class="flex md:flex-col items-end justify-between w-full md:w-auto border-t md:border-t-0 pt-3 md:pt-0 border-gray-50 shrink-0">
                            <div class="text-right">
                                <div class="text-lg font-black tracking-tight ${isIncome ? 'text-emerald-600' : 'text-red-500'} ${isCanceled ? 'line-through text-gray-400' : ''}">${isIncome ? '+' : '-'} NT$ ${Number(r.amount).toLocaleString()}</div>
                                <div class="flex items-center gap-2 justify-end mt-1.5">
                                    ${receiptBtnHtml}
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${statusColor}">${r.status}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-end gap-1 w-full">${actionBtnHtml}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ================= 🌟 財務修改機制專區 🌟 =================
        function openEditModal(rowIndex) {
            const record = allRecords.find(r => r.rowIndex === rowIndex);
            if(!record) return;

            document.getElementById('editRowIndex').value = record.rowIndex;
            
            // 狀態標籤
            const badgeEl = document.getElementById('editModalStatusBadge');
            badgeEl.innerText = record.status;

            // 處理日期格式兼容 YYYY/MM/DD -> YYYY-MM-DD
            let formattedDate = record.date;
            if(formattedDate.includes('/')) formattedDate = formattedDate.replace(/\//g, '-');
            document.getElementById('editDate').value = formattedDate;
            document.getElementById('editAmount').value = record.amount;
            document.getElementById('editDesc').value = record.desc;

            const selectEl = document.getElementById('editCategory');
            selectEl.innerHTML = '';
            
            let categories = [];
            if (record.type === '收入') {
                categories = ["會員會費", "個人捐款", "前期結餘", "其他收入"];
            } else {
                categories = expenseCategoryMap[record.role || auth.role] || ["場地費用", "活動雜支", "文書雜支", "其他"];
            }
            
            if (!categories.includes(record.category)) categories.push(record.category);

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                if(cat === record.category) opt.selected = true;
                selectEl.appendChild(opt);
            });

            // 🌟 判斷是否顯示彈窗內的「作廢按鈕」
            // 條件：如果狀態為「待會長核准」且（是申請人本人 或 是會長/財務）
            const canCancel = (record.status === '待會長核准') && (auth.name === record.applicant || auth.role === '會長' || auth.role === '財務');
            const cancelContainer = document.getElementById('modalCancelContainer');
            if (canCancel) {
                cancelContainer.classList.remove('hidden');
            } else {
                cancelContainer.classList.add('hidden');
            }

            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        // 從修改彈窗中觸發作廢
        function triggerCancelFromEditModal() {
            const rowIndex = document.getElementById('editRowIndex').value;
            closeEditModal(); // 關閉修改彈窗
            triggerCancel(rowIndex); // 開啟原本的作廢說明輸入彈窗
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
        }

        async function submitEditAction() {
            const rowIndex = document.getElementById('editRowIndex').value;
            const date = document.getElementById('editDate').value;
            const category = document.getElementById('editCategory').value;
            const amount = document.getElementById('editAmount').value;
            const desc = document.getElementById('editDesc').value;

            if (!date || !amount || amount <= 0) {
                alert("請填寫正確的日期與金額！");
                return;
            }

            closeEditModal();
            showLoading(true, "紀錄修改同步中...");

            try {
                // 採用 update_finance_status 並附帶 newData (支援 O/P/Q 機制)
                const payload = {
                    type: 'update_finance_status',
                    key: auth.key,
                    rowIndex: rowIndex,
                    action: 'edit',
                    newData: {
                        date: date,
                        category: category,
                        amount: amount,
                        description: desc
                    }
                };

                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();

                if (result.result === 'SUCCESS') {
                    showToast("✅ 修改成功，已記錄至歷程");
                    await loadRecords();
                } else {
                    showToast("❌ 修改失敗：" + result.message);
                }
            } catch (err) {
                showToast("❌ 網路異常，無法連線");
            }
            showLoading(false);
        }

        // ================= 🌟 狀態與作廢機制專區 🌟 =================
        function triggerCancel(rowIndex) {
            document.getElementById('cancelRowIndex').value = rowIndex;
            document.getElementById('cancelReasonInput').value = '';
            document.getElementById('cancelModal').classList.remove('hidden');
            document.getElementById('cancelModal').classList.add('flex');
        }

        function closeCancelModal() {
            document.getElementById('cancelModal').classList.add('hidden');
            document.getElementById('cancelModal').classList.remove('flex');
        }

        async function submitCancelAction() {
            const rowIndex = document.getElementById('cancelRowIndex').value;
            const reason = document.getElementById('cancelReasonInput').value.trim();

            if (!reason) {
                alert("請務必輸入作廢說明，以便登錄 P 欄備查！");
                return;
            }

            closeCancelModal();
            showLoading(true, "紀錄作廢處理中...");

            try {
                const payload = {
                    type: 'update_finance_status',
                    key: auth.key,
                    rowIndex: rowIndex,
                    action: 'cancel',
                    reason: reason // 會寫入至 P 欄
                };

                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();

                if (result.result === 'SUCCESS') {
                    showToast("✅ 該筆紀錄已作廢");
                    await loadRecords();
                } else {
                    showToast("❌ 操作失敗：" + result.message);
                }
            } catch (err) {
                showToast("❌ 網路異常");
            }
            showLoading(false);
        }

        function filterRecords(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const active = btn.dataset.type === type;
                btn.className = `filter-btn text-xs font-bold px-3 py-1.5 rounded-xl transition ${active ? 'bg-emerald-800 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
            });
            renderRecords();
        }

        async function updateStatus(rowIndex, action) {
            if (!confirm("確定要執行此簽核步驟嗎？此動作將寫入 Q 欄歷程。")) return;

            showLoading(true, "簽核狀態更新中...");
            try {
                const payload = {
                    type: 'update_finance_status',
                    key: auth.key,
                    rowIndex: rowIndex,
                    action: action
                };

                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();

                if (result.result === 'SUCCESS') {
                    showToast("✅ " + result.message);
                    await loadRecords();
                } else {
                    showToast("❌ 操作失敗：" + result.message);
                }
            } catch (err) {
                showToast("❌ 網路異常");
            }
            showLoading(false);
        }

        // ================= 🌟 填寫請款表單專區 🌟 =================
        function switchApplyMode(mode) {
            // 🌟 嚴格防護：檢查若要切換到 'income'（入帳），必須確認當前身分為「財務」或「會長」
            if (mode === 'income' && auth.role !== '財務' && auth.role !== '會長') {
                showToast("❌ 權限不足：只有財務幹部與會長能執行入帳作業");
                return; // 直接攔截，不予切換
            }

            applyMode = mode;
            document.getElementById('subtab-expense').className = mode === 'expense' ? 'flex-1 py-2.5 rounded-xl font-black text-sm bg-white shadow-sm text-emerald-900 transition-all' : 'flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 hover:text-emerald-700 transition-all';
            document.getElementById('subtab-income').className = mode === 'income' ? 'flex-1 py-2.5 rounded-xl font-black text-sm bg-white shadow-sm text-emerald-900 transition-all' : 'flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 hover:text-emerald-700 transition-all';
            
            document.getElementById('formTitle').innerText = mode === 'expense' ? '新增支出請款' : '新增入帳紀錄';
            document.getElementById('receiptSection').classList.toggle('hidden', mode === 'income');

            const selectEl = document.getElementById('recordCategory');
            selectEl.innerHTML = '';

            if (mode === 'expense') {
                const roleCategories = expenseCategoryMap[auth.role] || ["其他"];
                roleCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    selectEl.appendChild(opt);
                });
            } else {
                const incomeCategories = ["會員會費", "個人捐款", "前期結餘", "其他收入"];
                incomeCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    selectEl.appendChild(opt);
                });
            }
        }

        function toggleReceiptInput() {
            const isChecked = document.getElementById('hasReceipt').checked;
            document.getElementById('receiptInputContainer').classList.toggle('hidden', !isChecked);
        }

        async function previewReceipt(event) {
            const file = event.target.files[0];
            const statusEl = document.getElementById('receiptStatus');
            if (file) {
                statusEl.innerText = `🔄 照片優化壓縮中...`;
                statusEl.classList.remove('hidden');
                try {
                    selectedReceiptBase64 = await convertFileToBase64(file);
                    selectedReceiptName = file.name;
                    statusEl.innerHTML = `<i class="fas fa-check-circle"></i> 單據照片已準備就緒 (${Math.round(file.size/1024)}KB)`;
                } catch (e) {
                    statusEl.innerHTML = `<span class="text-red-500">❌ 圖片處理失敗</span>`;
                }
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function submitRecord() {
            const date = document.getElementById('recordDate').value;
            const category = document.getElementById('recordCategory').value;
            const amount = document.getElementById('recordAmount').value;
            const desc = document.getElementById('recordDesc').value;
            const hasReceipt = document.getElementById('hasReceipt').checked;

            if (!date || !amount || amount <= 0) {
                alert("請填寫正確的日期與金額！");
                return;
            }

            const payload = {
                type: 'submit_finance_record',
                key: auth.key,
                recordType: applyMode === 'expense' ? '支出' : '收入',
                date: date,
                category: category,
                amount: amount,
                description: desc,
                applicantName: auth.name,
                applicantRole: auth.role,
                hasReceipt: (applyMode === 'expense' && hasReceipt),
                fileData: selectedReceiptBase64,
                fileName: selectedReceiptName
            };

            showLoading(true, "送出請款表單中...");
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();

                if (result.result === 'SUCCESS') {
                    showToast("✅ " + result.message);
                    document.getElementById('recordAmount').value = '';
                    document.getElementById('recordDesc').value = '';
                    document.getElementById('hasReceipt').checked = false;
                    selectedReceiptBase64 = null;
                    toggleReceiptInput();
                    document.getElementById('receiptStatus').classList.add('hidden');
                    switchView('list');
                } else {
                    showToast("❌ 提交失敗：" + result.message);
                }
            } catch (err) {
                showToast("❌ 網路異常，無法連線至資料庫");
            }
            showLoading(false);
        }

        function showLoading(show, text = "處理中...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }

        // ================= 🌟 報表系統 🌟 =================
        let reportDataForCSV = [];

        function openReportModal() {
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
            generateReport();
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        function generateReport() {
            let prevBalance = 0;
            let rawIncomeMap = new Map();   
            let rawExpenseMap = new Map();  
            let totalIncome = 0;
            let totalExpense = 0;

            allRecords.forEach(r => {
                if (r.status === '已作廢') return;

                const amt = Number(r.amount) || 0;
                const cat = (r.category || '未分類').trim();
                const group = (r.role || '一般').trim();

                if (r.type === '收入') {
                    if (cat === '前期結餘') {
                        prevBalance += amt;
                    } else {
                        const key = `總務/財務_${cat}`;
                        const currentAmt = rawIncomeMap.get(key) || 0;
                        rawIncomeMap.set(key, currentAmt + amt);
                        totalIncome += amt;
                    }
                } else if (r.type === '支出' && r.status === '已結案') { 
                    const key = `${group}_${cat}`;
                    const currentAmt = rawExpenseMap.get(key) || 0;
                    rawExpenseMap.set(key, currentAmt + amt);
                    totalExpense += amt;
                }
            });

            let html = `
                <table class="w-full text-sm text-left border-collapse border border-gray-200 bg-white shadow-sm rounded-xl overflow-hidden">
                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900 border-b-2 border-emerald-600">
                            <th class="p-3 font-black w-1/4">組別</th>
                            <th class="p-3 font-black w-2/4">項目</th>
                            <th class="p-3 font-black w-1/4 text-right">金額 (NT$)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            reportDataForCSV = [ ["組別", "項目", "金額 (NT$)"] ];

            html += `
                <tr class="border-b border-gray-200 bg-emerald-50/30">
                    <td class="p-3 font-bold text-gray-700">前期幹部</td>
                    <td class="p-3 font-bold text-gray-800">上期結餘</td>
                    <td class="p-3 font-black text-right text-emerald-700">${prevBalance.toLocaleString()}</td>
                </tr>
            `;
            reportDataForCSV.push(["前期幹部", "上期結餘", prevBalance]);

            if (rawIncomeMap.size > 0) {
                html += `<tr class="bg-gray-100"><td colspan="3" class="p-2 font-black text-emerald-900 text-xs border-b border-gray-200 tracking-wider">【 本期收入 】</td></tr>`;
                reportDataForCSV.push(["", "", ""]);
                reportDataForCSV.push(["【 本期收入 】", "", ""]);

                rawIncomeMap.forEach((amt, key) => {
                    const [grp, cat] = key.split('_');
                    html += `
                        <tr class="border-b border-gray-100">
                            <td class="p-3 text-gray-600 font-bold">${grp}</td>
                            <td class="p-3 text-gray-800 font-bold">${cat}</td>
                            <td class="p-3 text-right font-black text-emerald-600">${amt.toLocaleString()}</td>
                        </tr>
                    `;
                    reportDataForCSV.push([grp, cat, amt]);
                });
            }

            if (rawExpenseMap.size > 0) {
                html += `<tr class="bg-gray-100"><td colspan="3" class="p-2 font-black text-red-900 text-xs border-b border-gray-200 tracking-wider">【 本期支出 】</td></tr>`;
                reportDataForCSV.push(["", "", ""]);
                reportDataForCSV.push(["【 本期支出 】", "", ""]);

                rawExpenseMap.forEach((amt, key) => {
                    const [grp, cat] = key.split('_');
                    html += `
                        <tr class="border-b border-gray-100">
                            <td class="p-3 text-gray-600 font-bold">${grp}</td>
                            <td class="p-3 text-gray-800 font-bold">${cat}</td>
                            <td class="p-3 text-right font-black text-red-500">${amt.toLocaleString()}</td>
                        </tr>
                    `;
                    reportDataForCSV.push([grp, cat, amt]);
                });
            }

            const finalBalance = prevBalance + totalIncome - totalExpense;
            html += `
                    </tbody>
                    <tfoot>
                        <tr class="bg-emerald-800 text-white">
                            <td colspan="2" class="p-4 font-black text-right tracking-widest">本期總結餘</td>
                            <td class="p-4 font-black text-right text-lg">${finalBalance.toLocaleString()}</td>
                        </tr>
                    </tfoot>
                </table>
            `;
            
            reportDataForCSV.push(["", "", ""]);
            reportDataForCSV.push(["-", "本期總結餘", finalBalance]);

            document.getElementById('reportContent').innerHTML = html;
        }

        function downloadCSV() {
            let csvContent = "\uFEFF"; 
            reportDataForCSV.forEach(row => {
                csvContent += row.join(",") + "\r\n";
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `財務結算表_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
